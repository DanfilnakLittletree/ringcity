<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>环城 · 社团通讯</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm" type="module"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        :root {
            --bg: #f0f2f5; --surface: #fff; --surface2: #f5f5f5; --text: #1e293b;
            --text2: #64748b; --border: #e2e8f0; --accent: #FF7F7F; --msg-self: #FF7F7F;
            --msg-other: #e4e6eb; --sidebar-bg: #f8fafc; --chat-bg: #fff;
        }
        body.dark {
            --bg: #0f1217; --surface: #1a1c28; --surface2: #242636; --text: #eef;
            --text2: #94a3b8; --border: #2c2e40; --accent: #c04040; --msg-self: #c04040;
            --msg-other: #2c2e3e; --sidebar-bg: #141622; --chat-bg: #1a1c28;
        }
        body { font-family:'Segoe UI',system-ui,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; transition:all 0.3s; }
        .app-bg { position:fixed; top:0; left:0; width:100%; height:100%; z-index:-1; background:var(--bg); }
        .app-container { max-width:1000px; margin:0 auto; padding:0.5rem; height:100vh; display:flex; flex-direction:column; }
        .auth-card { max-width:400px; margin:auto; background:var(--surface); border-radius:1.5rem; padding:2rem; text-align:center; box-shadow:0 10px 30px rgba(0,0,0,0.1); }
        input,select,textarea { width:100%; padding:10px; margin:5px 0; border-radius:8px; border:1px solid var(--border); background:var(--surface2); color:var(--text); font-size:0.95rem; font-family:inherit; }
        button { padding:10px 16px; border:none; border-radius:8px; background:var(--accent); color:white; font-weight:600; cursor:pointer; font-size:0.9rem; }
        button:hover { opacity:0.85; }
        .chat-layout { display:flex; gap:0.5rem; height:100%; background:var(--chat-bg); border-radius:1rem; padding:0.5rem; overflow:hidden; }
        .sidebar { width:200px; background:var(--sidebar-bg); border-radius:0.8rem; padding:0.5rem; overflow-y:auto; display:flex; flex-direction:column; flex-shrink:0; }
        .sidebar h3 { margin-bottom:0.5rem; font-size:0.85rem; }
        .user-item { padding:0.3rem 0.5rem; border-radius:0.5rem; display:flex; align-items:center; gap:0.3rem; font-size:0.8rem; }
        .user-item:hover { background:rgba(128,128,128,0.1); }
        .online-dot { width:6px; height:6px; border-radius:50%; flex-shrink:0; }
        .user-avatar { width:22px; height:22px; border-radius:50%; object-fit:cover; flex-shrink:0; }
        .title-tag { font-size:0.55rem; background:var(--accent); color:white; padding:1px 5px; border-radius:0.5rem; opacity:0.8; }
        .main-area { flex:1; display:flex; flex-direction:column; min-width:0; overflow:hidden; }
        .top-bar { display:flex; gap:0.3rem; margin-bottom:0.4rem; align-items:center; flex-shrink:0; flex-wrap:wrap; }
        .tab-btn { padding:0.3rem 0.7rem; border-radius:0.5rem; background:var(--surface2); border:none; color:var(--text2); cursor:pointer; font-size:0.75rem; }
        .tab-btn.active { background:var(--accent); color:white; }
        .announce-bar { background:rgba(245,158,11,0.15); padding:0.3rem 0.6rem; border-radius:0.5rem; margin-bottom:0.4rem; font-size:0.75rem; overflow:hidden; white-space:nowrap; flex-shrink:0; }
        .chat-messages { flex:1; overflow-y:auto; padding:0.4rem; display:flex; flex-direction:column; gap:0.5rem; min-height:0; }
        .message { max-width:80%; flex-shrink:0; }
        .message.self { align-self:flex-end; }
        .message-bubble { background:var(--msg-other); padding:0.4rem 0.7rem; border-radius:0.7rem; font-size:0.8rem; word-wrap:break-word; }
        .message.self .message-bubble { background:var(--msg-self); color:white; }
        .message-info { font-size:0.6rem; opacity:0.6; margin-bottom:0.1rem; }
        .input-area { display:flex; gap:0.4rem; margin-top:0.4rem; flex-shrink:0; }
        .input-area input { flex:1; margin:0; }
        .input-area button { width:auto; }
        .modal-overlay { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); z-index:100; display:flex; align-items:center; justify-content:center; }
        .modal-box { background:var(--surface); border-radius:1rem; padding:1.5rem; max-width:500px; width:92%; max-height:85vh; overflow-y:auto; }
        .guestbook-item { background:var(--surface2); padding:0.4rem 0.6rem; border-radius:0.5rem; margin-bottom:0.3rem; font-size:0.8rem; }
        .archive-detail { background:var(--surface2); padding:0.8rem; border-radius:0.8rem; margin-top:0.3rem; font-size:0.85rem; line-height:1.5; }
        .footer-note { text-align:center; padding:0.3rem; font-size:0.6rem; opacity:0.3; }
        .bottom-nav { display:none; position:fixed; bottom:0; left:0; right:0; background:var(--surface); border-top:1px solid var(--border); padding:0.4rem; z-index:50; justify-content:space-around; }
        .bottom-nav button { background:none; color:var(--text2); font-size:0.7rem; display:flex; flex-direction:column; align-items:center; gap:0.1rem; padding:0.3rem; }
        .bottom-nav button.active { color:var(--accent); }
        .crop-overlay { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:200; display:flex; align-items:center; justify-content:center; flex-direction:column; }
        .crop-container { position:relative; width:280px; height:280px; overflow:hidden; border-radius:1rem; }
        .crop-container img { position:absolute; max-width:none; }
        .crop-frame { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:200px; height:200px; border:2px dashed white; border-radius:50%; pointer-events:none; }
        @media (max-width:768px) {
            .sidebar { display:none; }
            .bottom-nav { display:flex; }
            .app-container { padding-bottom:3.5rem; }
            .message { max-width:90%; }
        }
    </style>
</head>
<body>
<div class="app-bg"></div>
<div id="app">
    <div id="authView" class="app-container" style="justify-content:center;">
        <div class="auth-card">
            <h2>🏛️ 环城社团通讯</h2>
            <p style="opacity:0.6;margin-bottom:1rem;">秩序之光，永远照耀环城</p>
            <input type="text" id="loginId" placeholder="ID">
            <input type="password" id="loginPwd" placeholder="密码">
            <button onclick="doLogin()">登录</button>
            <button onclick="showRegister()" style="background:var(--surface2);color:var(--text);margin-top:0.3rem;">注册</button>
            <p id="loginError" style="color:#ef4444;font-size:0.8rem;"></p>
        </div>
    </div>
    <div id="chatView" class="app-container" style="display:none;">
        <div class="chat-layout">
            <div class="sidebar" id="sidebar">
                <h3>👥 成员</h3>
                <input type="text" id="userSearch" placeholder="搜索..." style="font-size:0.75rem;padding:6px;">
                <div id="userList" style="flex:1;overflow-y:auto;margin-top:0.3rem;"></div>
                <button onclick="logout()" style="margin-top:0.5rem;font-size:0.7rem;background:var(--surface2);color:var(--text);">登出</button>
            </div>
            <div class="main-area">
                <div class="top-bar">
                    <span style="font-weight:600;font-size:0.85rem;">环城通讯</span>
                    <span style="flex:1;"></span>
                    <button class="tab-btn active" onclick="switchTab('chat')">💬</button>
                    <button class="tab-btn" onclick="switchTab('archive')">📖</button>
                    <span id="currentUserDisplay" style="font-size:0.75rem;opacity:0.7;cursor:pointer;" onclick="openProfile()"></span>
                    <button onclick="toggleDark()" style="background:none;font-size:1rem;">🌙</button>
                    <button id="adminBtn" onclick="openAdminPanel()" style="display:none;background:none;">⚙️</button>
                </div>
                <div id="announceBar" class="announce-bar" style="display:none;"></div>
                <div id="chatPanel">
                    <div class="chat-messages" id="chatMessages"><p style="text-align:center;opacity:0.5;padding:2rem;">暂无消息</p></div>
                    <div class="input-area">
                        <input type="text" id="messageInput" placeholder="输入消息...">
                        <button onclick="sendMessage()">发送</button>
                    </div>
                </div>
                <div id="archivePanel" style="display:none;flex:1;overflow-y:auto;padding:0.3rem;min-height:0;">
                    <input type="text" id="worldSearch" placeholder="🔍 搜索档案..." style="margin-bottom:0.4rem;">
                    <div id="worldCards" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:0.4rem;"></div>
                </div>
            </div>
        </div>
    </div>
    <div class="bottom-nav" id="bottomNav">
        <button class="active" onclick="switchTab('chat')">💬 通讯</button>
        <button onclick="switchTab('guestbook')">📝 留言</button>
        <button onclick="switchTab('archive')">📖 档案</button>
        <button onclick="openProfile()">👤 我</button>
        <button onclick="openAdminPanel()" id="adminBtnMobile" style="display:none;">⚙️</button>
    </div>
</div>
<div class="footer-note">隙相·不归档·不保留·阅后即忘</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const SUPABASE_URL = 'https://fflngacqldvyzvhpolch.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZmbG5nYWNxbGR2eXp2aHBvbGNoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE4ODQ3MTAsImV4cCI6MjA5NzQ2MDcxMH0.bkLyI6T4zNzClNlHqNO4O7wPu40Ep6xb2x5cUD0Hvgk';
const ringDB = createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: false } });
const MODERATORS = ["Danfilnak", "admin"];
let currentUser = null, currentTab = 'chat';
const renderedMsgIds = new Set(); let lastMsgTimestamp = 0;

const defaultWorld = [
    { id:1, title:"环城区域划分", content:"环城从内到外依次为：天之柱→神域→中坚都市/内环→高街区/中环→外圈→暗巷→外界城→里界。地下有夜都。" },
    { id:2, title:"隙民 / 隙相", content:"活在环城规则缝隙中的族群。无固定身份，擅长走私、偷渡、传话。理事会私下称其为「隙相(Gap-phase)」。代表人物：利希塔·瑞茨尔。" },
    { id:3, title:"环三角", content:"环城的执法利刃，各圈均有部署。神域由万斯独自看守——空间切割能力，已正式死亡277次。" },
    { id:4, title:"徽旗派", content:"丽塔·多其米拉·尤尔特领导的组织，口号是消除阶级差异。丽塔拥有「偷换概念」能力。" },
    { id:5, title:"城界禁令", content:"公民活动范围仅限环城之内。暗巷居民不具备公民资格。遵守规则，即是守护您的幸福。" },
    { id:6, title:"夜都", content:"环城地下的巨大废墟都会，没有招牌的店铺交易着环城禁止的一切。隙民常在此接活。" }
];

window.toggleDark = () => {
    document.body.classList.toggle('dark');
    localStorage.setItem('darkMode', document.body.classList.contains('dark'));
    document.querySelector('.top-bar button[onclick="toggleDark()"]').innerText = document.body.classList.contains('dark') ? '☀️' : '🌙';
};

window.showRegister = () => {
    const id = prompt('输入新ID（字母数字下划线）：');
    if (!id || !/^[a-zA-Z0-9_]+$/.test(id)) return alert('ID格式错误');
    const pwd = prompt('输入密码：');
    if (!pwd) return;
    ringDB.from('users').insert({ id, pwd, theme:'ringcity', unlocked_themes:'["ringcity"]', last_active:Date.now(), title:'', status:'', avatar:'', title_approved:false, avatar_approved:false }).then(r => {
        if (r.error) return alert('注册失败：' + r.error.message);
        alert('✅ 注册成功！请登录');
    });
};

window.doLogin = async () => {
    const id = document.getElementById('loginId').value.trim();
    const pwd = document.getElementById('loginPwd').value;
    const { data } = await ringDB.from('users').select('*').eq('id', id).eq('pwd', pwd);
    if (!data || data.length === 0) return document.getElementById('loginError').innerText = 'ID或密码错误';
    currentUser = data[0];
    document.getElementById('authView').style.display = 'none';
    document.getElementById('chatView').style.display = 'flex';
    updateCurrentUserDisplay();
    const isAdmin = MODERATORS.includes(currentUser.id);
    document.getElementById('adminBtn').style.display = isAdmin ? 'inline-block' : 'none';
    document.getElementById('adminBtnMobile').style.display = isAdmin ? 'flex' : 'none';
    await ringDB.from('users').update({ last_active: Date.now() }).eq('id', id);
    renderedMsgIds.clear(); lastMsgTimestamp = 0;
    document.getElementById('chatMessages').innerHTML = '<p style="text-align:center;opacity:0.5;padding:2rem;">加载中...</p>';
    loadMessages(true); loadUsers(); loadAnnouncement(); loadArchive();
    setInterval(() => loadMessages(false), 3000);
    setInterval(loadUsers, 15000);
    if (localStorage.getItem('darkMode')==='true') { document.body.classList.add('dark'); document.querySelector('.top-bar button[onclick="toggleDark()"]').innerText='☀️'; }
};

function updateCurrentUserDisplay() {
    const parts = [currentUser.id];
    if (currentUser.title_approved && currentUser.title) parts.push('· '+currentUser.title);
    document.getElementById('currentUserDisplay').innerText = parts.join(' ');
}

window.logout = () => { currentUser=null; document.getElementById('authView').style.display='flex'; document.getElementById('chatView').style.display='none'; };

window.switchTab = (tab) => {
    currentTab = tab;
    document.getElementById('chatPanel').style.display = tab==='chat'||tab==='guestbook'?'block':'none';
    document.getElementById('archivePanel').style.display = tab==='archive'?'block':'none';
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.bottom-nav button').forEach(b=>b.classList.remove('active'));
    if (tab==='chat') { document.querySelector('.tab-btn:nth-of-type(1)').classList.add('active'); document.querySelectorAll('.bottom-nav button')[0].classList.add('active'); }
    if (tab==='guestbook') { loadGuestbook(); document.querySelectorAll('.bottom-nav button')[1].classList.add('active'); }
    if (tab==='archive') { document.querySelector('.tab-btn:nth-of-type(2)').classList.add('active'); document.querySelectorAll('.bottom-nav button')[2].classList.add('active'); loadArchive(); }
    if (tab==='guestbook') {
        document.getElementById('chatMessages').innerHTML = '<div id="guestbookList" style="flex:1;overflow-y:auto;"></div><div class="input-area"><input type="text" id="guestbookInput" placeholder="在墙上留一句话..."><button onclick="postGuestbook()">留言</button></div>';
        loadGuestbook();
    }
    if (tab==='chat') { document.getElementById('chatMessages').innerHTML = '<p style="text-align:center;opacity:0.5;padding:2rem;">加载中...</p>'; loadMessages(true); }
};

async function loadMessages(isInitial) {
    const { data } = await ringDB.from('messages').select('*').order('timestamp',{ascending:true}).limit(200);
    const container = document.getElementById('chatMessages');
    if (!container || currentTab==='guestbook' || currentTab==='archive') return;
    if (!data||data.length===0) { if(isInitial) container.innerHTML='<p style="text-align:center;opacity:0.5;padding:2rem;">暂无消息</p>'; return; }
    const wasAtBottom = container.scrollHeight - container.scrollTop - container.clientHeight < 60;
    if (isInitial) { container.innerHTML=''; renderedMsgIds.clear(); data.forEach(m=>appendMessage(m)); }
    else { data.filter(m=>m.timestamp>lastMsgTimestamp).forEach(m=>{ if(!renderedMsgIds.has(m.id)) appendMessage(m); }); }
    if(data.length>0) lastMsgTimestamp=data[data.length-1].timestamp;
    if(wasAtBottom||isInitial) container.scrollTop=container.scrollHeight;
}

function appendMessage(m) {
    renderedMsgIds.add(m.id);
    const container = document.getElementById('chatMessages');
    if (container.querySelector('p[style]')) container.innerHTML='';
    const isSelf = currentUser && m.from===currentUser.id;
    const div = document.createElement('div');
    div.className=`message ${isSelf?'self':'other'}`;
    div.innerHTML=`<div class="message-info">${m.from} ${new Date(m.timestamp).toLocaleTimeString()}</div><div class="message-bubble">${m.content}</div>`;
    container.appendChild(div);
}

window.sendMessage = async () => {
    const inp = document.getElementById('messageInput'); if (!inp.value.trim()) return;
    await ringDB.from('messages').insert({ from:currentUser.id, type:'text', content:inp.value.trim(), timestamp:Date.now() });
    inp.value=''; loadMessages(true);
};

async function loadUsers() {
    const { data } = await ringDB.from('users').select('*');
    const kw = (document.getElementById('userSearch')?.value||'').toLowerCase();
    const filtered = (data||[]).filter(u=>u.id.toLowerCase().includes(kw));
    const now = Date.now();
    const list = document.getElementById('userList'); if (!list) return;
    list.innerHTML = filtered.map(u=>{
        const diff = now-(u.last_active||0);
        const dot = diff<180000?'#4ade80':diff<900000?'#fbbf24':'#888';
        const avatar = u.avatar&&u.avatar_approved?`<img src="${u.avatar}" class="user-avatar">`:'';
        return `<div class="user-item"><span class="online-dot" style="background:${dot};"></span>${avatar}${u.id}${u.title_approved&&u.title?`<span class="title-tag">${u.title}</span>`:''}</div>`;
    }).join('');
}

async function loadGuestbook() {
    const { data } = await ringDB.from('guestbook').select('*').order('timestamp',{ascending:false}).limit(50);
    const container = document.getElementById('guestbookList');
    if (!container) return;
    container.innerHTML = (data||[]).map(g=>`<div class="guestbook-item"><b>${g.author}</b>: ${g.content}</div>`).join('')||'<p style="opacity:0.5;">墙上空空如也</p>';
}

window.postGuestbook = async () => {
    const inp = document.getElementById('guestbookInput');
    if (!inp.value.trim()) return;
    await ringDB.from('guestbook').insert({ author:currentUser.id, content:inp.value.trim(), timestamp:Date.now() });
    inp.value=''; loadGuestbook();
};

async function loadAnnouncement() {
    const { data } = await ringDB.from('world').select('data').eq('id',1).single();
    const wd = data?data.data:defaultWorld;
    const announce = wd.find(i=>i.id===999);
    const bar = document.getElementById('announceBar');
    if (announce) { bar.style.display='block'; bar.innerText='📢 '+announce.content; }
    else bar.style.display='none';
}

async function loadArchive() {
    const { data } = await ringDB.from('world').select('data').eq('id',1).single();
    const wd = data?data.data:defaultWorld;
    const kw = (document.getElementById('worldSearch')?.value||'').toLowerCase();
    const filtered = wd.filter(i=>i.title.toLowerCase().includes(kw)||i.content.toLowerCase().includes(kw));
    document.getElementById('worldCards').innerHTML = filtered.map(i=>`
        <div class="guestbook-item" style="cursor:pointer;" onclick="toggleArchiveDetail(this,'${i.id}')">
            <b>📄 ${i.title}</b>
            <p style="font-size:0.7rem;opacity:0.6;">${i.content.slice(0,50)}...</p>
            <div class="archive-detail" style="display:none;">${i.content}</div>
        </div>
    `).join('');
}

window.toggleArchiveDetail = (el, id) => {
    const detail = el.querySelector('.archive-detail');
    detail.style.display = detail.style.display==='none'?'block':'none';
};

window.openProfile = () => {
    const overlay = document.createElement('div'); overlay.className='modal-overlay';
    overlay.innerHTML = `<div class="modal-box">
        <h3>👤 ${currentUser.id}</h3>
        ${currentUser.avatar_approved&&currentUser.avatar?`<img src="${currentUser.avatar}" style="width:60px;height:60px;border-radius:50%;margin:0.5rem 0;">`:'<div style="width:60px;height:60px;border-radius:50%;background:var(--surface2);margin:0.5rem 0;display:flex;align-items:center;justify-content:center;">📷</div>'}
        <p style="font-size:0.8rem;">头衔：${currentUser.title_approved&&currentUser.title?currentUser.title:'无'}</p>
        <p style="font-size:0.8rem;">状态：${currentUser.status||'未设置'}</p>
        <button onclick="uploadAvatarPrompt()">📸 上传头像</button>
        <button onclick="setStatus()" style="margin-top:0.3rem;">✏️ 设置状态</button>
        <button onclick="this.closest('.modal-overlay').remove()" style="margin-top:0.5rem;background:var(--surface2);color:var(--text);">关闭</button>
    </div>`;
    document.body.appendChild(overlay);
    overlay.addEventListener('click',e=>{if(e.target===overlay) overlay.remove();});
};

window.uploadAvatarPrompt = () => {
    const inp = document.createElement('input'); inp.type='file'; inp.accept='image/*';
    inp.onchange = () => {
        const file = inp.files[0]; if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
            const img = new Image(); img.src = e.target.result;
            img.onload = () => showCropModal(img);
        };
        reader.readAsDataURL(file);
    };
    inp.click();
};

function showCropModal(img) {
    const overlay = document.createElement('div'); overlay.className='crop-overlay';
    let scale=1, x=0, y=0;
    const size = Math.min(img.width, img.height);
    const initScale = 200/size;
    scale = initScale;
    overlay.innerHTML = `<div class="crop-container"><img src="${img.src}" id="cropImg" style="width:${img.width}px;height:${img.height}px;transform:translate(${x}px,${y}px) scale(${scale});transform-origin:0 0;"></div><div class="crop-frame"></div>
        <div style="margin-top:0.5rem;display:flex;gap:0.5rem;"><input type="range" min="0.5" max="3" step="0.1" value="${scale}" oninput="updateCropScale(this.value)"><button onclick="confirmCrop()">✅ 确认</button><button onclick="this.closest('.crop-overlay').remove()">取消</button></div>`;
    document.body.appendChild(overlay);
    window.updateCropScale = (v) => { scale=parseFloat(v); document.getElementById('cropImg').style.transform=`translate(${x}px,${y}px) scale(${scale})`; };
    window.confirmCrop = async () => {
        const cvs = document.createElement('canvas'); cvs.width=200; cvs.height=200;
        const ctx = cvs.getContext('2d');
        const sx = (img.width/2 - 100/scale); const sy = (img.height/2 - 100/scale);
        ctx.drawImage(img, sx, sy, 200/scale, 200/scale, 0, 0, 200, 200);
        const base64 = cvs.toDataURL('image/jpeg', 0.8);
        await ringDB.from('users').update({ avatar: base64, avatar_approved: false }).eq('id', currentUser.id);
        currentUser.avatar = base64; currentUser.avatar_approved = false;
        alert('✅ 头像已提交审核');
        document.querySelectorAll('.crop-overlay,.modal-overlay').forEach(e=>e.remove());
        loadUsers();
    };
}

window.setStatus = async () => {
    const s = prompt('设置个人状态：', currentUser.status||'');
    if (s===null) return;
    await ringDB.from('users').update({ status:s }).eq('id', currentUser.id);
    currentUser.status = s; loadUsers();
};

window.openAdminPanel = () => {
    if (!MODERATORS.includes(currentUser.id)) return;
    const overlay = document.createElement('div'); overlay.className='modal-overlay';
    overlay.innerHTML = `<div class="modal-box"><h3>⚙️ 审核员控制台</h3>
        <div><b>📸 头像审核</b><div id="adminAvatarList"></div></div>
        <div style="margin-top:0.5rem;"><b>🏷️ 头衔审核</b><div id="adminTitleList"></div></div>
        <div style="margin-top:0.5rem;"><b>👤 成员管理</b><div id="adminUserList"></div></div>
        <button onclick="exportChat()">💾 导出记录</button>
        <button onclick="clearChat()">🗑️ 清空记录</button>
        <button onclick="this.closest('.modal-overlay').remove()" style="background:var(--surface2);color:var(--text);">关闭</button></div>`;
    document.body.appendChild(overlay);
    overlay.addEventListener('click',e=>{if(e.target===overlay) overlay.remove();});
    loadAdminData();
};

async function loadAdminData() {
    const { data:users } = await ringDB.from('users').select('*');
    const { data:msgs } = await ringDB.from('messages').select('from');
    const counts = {}; (msgs||[]).forEach(m=>{counts[m.from]=(counts[m.from]||0)+1;});
    document.getElementById('adminAvatarList').innerHTML = (users||[]).filter(u=>u.avatar&&!u.avatar_approved).map(u=>`<div style="display:flex;align-items:center;gap:0.3rem;margin:0.2rem 0;"><img src="${u.avatar}" style="width:25px;height:25px;border-radius:50%;"><span style="font-size:0.7rem;">${u.id}</span><button onclick="approveAvatar('${u.id}')" style="font-size:0.6rem;padding:2px 6px;background:#10b981;">通过</button><button onclick="rejectAvatar('${u.id}')" style="font-size:0.6rem;padding:2px 6px;background:#ef4444;">拒绝</button></div>`).join('')||'<p style="opacity:0.5;font-size:0.7rem;">无待审头像</p>';
    document.getElementById('adminTitleList').innerHTML = (users||[]).filter(u=>u.title&&!u.title_approved).map(u=>`<div style="display:flex;align-items:center;gap:0.3rem;margin:0.2rem 0;"><span style="font-size:0.7rem;">${u.id}</span><span class="title-tag">${u.title}</span><button onclick="approveTitle('${u.id}')" style="font-size:0.6rem;padding:2px 6px;background:#10b981;">通过</button><button onclick="rejectTitle('${u.id}')" style="font-size:0.6rem;padding:2px 6px;background:#ef4444;">拒绝</button></div>`).join('')||'<p style="opacity:0.5;font-size:0.7rem;">无待审头衔</p>';
    document.getElementById('adminUserList').innerHTML = (users||[]).sort((a,b)=>(counts[b.id]||0)-(counts[a.id]||0)).map(u=>`<div style="display:flex;align-items:center;gap:0.3rem;margin:0.2rem 0;font-size:0.7rem;"><span>${u.id}</span><span style="opacity:0.5;">发言${counts[u.id]||0}次</span><button onclick="setTitle('${u.id}')" style="font-size:0.6rem;padding:2px 6px;">设头衔</button></div>`).join('');
}

window.approveAvatar = async (uid) => { await ringDB.from('users').update({avatar_approved:true}).eq('id',uid); loadAdminData(); loadUsers(); };
window.rejectAvatar = async (uid) => { await ringDB.from('users').update({avatar:'',avatar_approved:false}).eq('id',uid); loadAdminData(); loadUsers(); };
window.approveTitle = async (uid) => { await ringDB.from('users').update({title_approved:true}).eq('id',uid); loadAdminData(); loadUsers(); };
window.rejectTitle = async (uid) => { await ringDB.from('users').update({title:'',title_approved:false}).eq('id',uid); loadAdminData(); loadUsers(); };
window.setTitle = async (uid) => { const t=prompt('输入头衔（需审核）：'); if(t===null) return; await ringDB.from('users').update({title:t,title_approved:false}).eq('id',uid); loadAdminData(); loadUsers(); };

window.exportChat = async () => {
    const { data } = await ringDB.from('messages').select('*').order('timestamp',{ascending:true});
    const text = (data||[]).map(m=>`[${new Date(m.timestamp).toLocaleString()}] ${m.from}: ${m.content}`).join('\n');
    const blob = new Blob([text],{type:'text/plain'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='环城通讯记录.txt'; a.click();
};

window.clearChat = async () => {
    if(!confirm('确定清空所有聊天记录？')) return;
    const {data}=await ringDB.from('messages').select('id');
    if(data) for(const m of data) await ringDB.from('messages').delete().eq('id',m.id);
    renderedMsgIds.clear(); lastMsgTimestamp=0;
    document.getElementById('chatMessages').innerHTML='<p style="text-align:center;opacity:0.5;padding:2rem;">暂无消息</p>';
};

document.getElementById('messageInput').addEventListener('keypress',e=>{if(e.key==='Enter') sendMessage();});
document.getElementById('userSearch').addEventListener('input',loadUsers);
document.getElementById('worldSearch').addEventListener('input',loadArchive);
</script>
</body>
</html>
