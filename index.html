        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            25% { background-position: 100% 0%; }
            50% { background-position: 100% 100%; }
            75% { background-position: 0% 100%; }
        }
        @keyframes ritzShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        body { background: #f0f2f5; }
        body.dark { background: #0f1217; }

        .app-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 1rem;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ===== 登录卡片 ===== */
        .auth-card {
            max-width: 420px;
            margin: auto;
            background: var(--auth-card-bg);
            backdrop-filter: blur(20px);
            border-radius: 2rem;
            padding: 2.5rem;
            box-shadow: 0 20px 50px rgba(0,0,0,0.1);
            text-align: center;
            position: relative;
            z-index: 1;
            border: 1px solid var(--auth-card-border);
            transition: all 0.3s ease;
        }
        body.dark .auth-card { background: var(--dark-auth-card-bg); border-color: var(--dark-auth-card-border); }
        .auth-card h2 { margin-bottom: 0.5rem; font-weight: 600; }
        .auth-subtitle { color: var(--text-muted); margin-bottom: 1.5rem; font-size: 0.9rem; }
        .input-group { margin: 1rem 0; }
        .input-group input {
            width: 100%;
            padding: 14px 18px;
            border-radius: 3rem;
            border: 2px solid #e8d5d0;
            background: rgba(255,255,255,0.8);
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }
        body.dark .input-group input {
            background: rgba(40,42,55,0.8);
            border-color: #3a4a35;
            color: white;
        }
        .input-group input:focus {
            border-color: var(--input-focus);
            box-shadow: 0 0 0 3px var(--input-focus-shadow);
        }
        button {
            background: var(--button-gradient);
            color: white;
            border: none;
            padding: 14px 24px;
            border-radius: 3rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            font-size: 1rem;
            transition: all 0.3s ease;
            letter-spacing: 0.5px;
        }
        button:hover { background: var(--button-hover); transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,0,0,0.2); }
        .switch-auth { margin-top: 1rem; font-size: 0.85rem; color: var(--input-focus); cursor: pointer; transition: color 0.3s; }
        .switch-auth:hover { opacity: 0.8; }
        .error { color: #ef4444; font-size: 0.8rem; margin-top: 0.5rem; }

        /* ===== 主布局 ===== */
        .chat-layout {
            display: flex;
            gap: 1rem;
            height: 100%;
            background: var(--chat-layout-bg);
            backdrop-filter: blur(25px);
            border-radius: 1.5rem;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
            position: relative;
            z-index: 1;
            border: 1px solid rgba(255,255,255,0.5);
            transition: all 0.3s ease;
        }
        body.dark .chat-layout { background: var(--dark-chat-layout-bg); border-color: rgba(255,255,255,0.08); }

        /* ===== 侧边栏 ===== */
        .sidebar {
            width: 270px;
            background: var(--sidebar-bg);
            backdrop-filter: blur(15px);
            display: flex;
            flex-direction: column;
            border-right: 1px solid rgba(0,0,0,0.06);
            transition: all 0.3s ease;
        }
        body.dark .sidebar { background: var(--dark-sidebar-bg); border-right-color: rgba(255,255,255,0.06); }
        .sidebar-header { padding: 1.3rem; border-bottom: 1px solid rgba(0,0,0,0.06); }
        body.dark .sidebar-header { border-bottom-color: rgba(255,255,255,0.06); }
        .sidebar-header h3 { margin-bottom: 0.6rem; font-weight: 600; }
        .search-box {
            width: 100%;
            padding: 10px 14px;
            border-radius: 2rem;
            border: 2px solid #e8d5d0;
            background: rgba(255,255,255,0.7);
            outline: none;
            transition: all 0.3s ease;
        }
        body.dark .search-box { background: rgba(30,32,44,0.7); border-color: #3a4a35; color: white; }
        .search-box:focus { border-color: var(--input-focus); box-shadow: 0 0 0 3px var(--input-focus-shadow); }
        .user-list { flex: 1; overflow-y: auto; padding: 0.5rem; }
        .user-item {
            padding: 0.7rem 1rem;
            border-radius: 1rem;
            margin-bottom: 0.3rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: all 0.25s ease;
        }
        .user-item:hover { background: rgba(255,127,127,0.1); transform: translateX(3px); }
        body.dark .user-item:hover { background: rgba(138,154,91,0.15); }
        .user-name { font-weight: 500; }
        .role-badge {
            font-size: 0.65rem;
            background: var(--badge-gradient);
            color: white;
            padding: 3px 10px;
            border-radius: 1rem;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        .current-user-bar {
            padding: 1rem;
            border-top: 1px solid rgba(0,0,0,0.06);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        body.dark .current-user-bar { border-top-color: rgba(255,255,255,0.06); }

        /* ===== 主区域 ===== */
        .main-area { flex: 1; display: flex; flex-direction: column; }
        .top-bar {
            display: flex;
            border-bottom: 1px solid rgba(0,0,0,0.06);
            background: var(--top-bar-bg);
            backdrop-filter: blur(10px);
            position: relative;
        }
        body.dark .top-bar { border-bottom-color: rgba(255,255,255,0.06); background: var(--dark-top-bar-bg); }
        .top-bar::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0;
            width: 100%; height: 2px;
            background: var(--neon-bar);
            opacity: 0.7;
        }
        body.dark .top-bar::after { background: var(--dark-neon-bar); }
        .tab-btn {
            padding: 1rem 2rem;
            cursor: pointer;
            border: none;
            background: none;
            font-size: 1rem;
            font-weight: 500;
            color: var(--text-muted);
            transition: all 0.3s ease;
            position: relative;
            letter-spacing: 0.5px;
        }
        .tab-btn:hover { color: var(--input-focus); }
        .tab-btn.active { color: var(--input-focus); font-weight: 600; }
        .tab-btn.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 3px;
            background: var(--input-focus);
            border-radius: 3px 3px 0 0;
        }
        body.dark .tab-btn { color: var(--text-muted); }
        body.dark .tab-btn:hover { color: var(--dark-input-focus); }
        body.dark .tab-btn.active { color: var(--dark-input-focus); }
        body.dark .tab-btn.active::after { background: var(--dark-input-focus); }

        .header-right { margin-left: auto; display: flex; align-items: center; padding-right: 1rem; gap: 0.5rem; }
        .theme-toggle-btn {
            background: none; width: 40px; height: 40px; border-radius: 50%;
            font-size: 1.2rem; cursor: pointer; border: none;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.3s ease; color: inherit;
        }
        .theme-toggle-btn:hover { background: rgba(0,0,0,0.05); transform: rotate(15deg); }
        .theme-palette-btn {
            background: none; width: 40px; height: 40px; border-radius: 50%;
            font-size: 1.2rem; cursor: pointer; border: none;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.3s ease; color: inherit;
        }
        .theme-palette-btn:hover { background: rgba(0,0,0,0.05); transform: scale(1.1); }
        .review-badge {
            background: var(--review-badge-gradient);
            color: white; padding: 6px 14px; border-radius: 2rem;
            font-size: 0.8rem; cursor: pointer; font-weight: 600;
            transition: all 0.3s ease; border: none;
        }
        .review-badge.has-pending { animation: pulse 2s ease-in-out infinite; }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); box-shadow: 0 0 15px rgba(245,158,11,0.4); }
        }

        /* ===== 聊天面板 ===== */
        .chat-messages { flex:1; overflow-y:auto; padding:1.5rem; display:flex; flex-direction:column; gap:1rem; }
        .message { display:flex; flex-direction:column; max-width:70%; position:relative; animation:slideIn 0.3s ease; }
        @keyframes slideIn { from{opacity:0;transform:translateY(10px);} to{opacity:1;transform:translateY(0);} }
        .message.self { align-self:flex-end; }
        .message.other { align-self:flex-start; }
        .message-info { font-size:0.7rem; margin-bottom:0.3rem; display:flex; gap:0.5rem; align-items:baseline; opacity:0.7; }
        .message-bubble {
            background: var(--other-msg-bg);
            backdrop-filter: blur(10px);
            padding: 0.7rem 1.1rem;
            border-radius: 1.3rem;
            word-wrap: break-word;
            line-height: 1.5;
            transition: all 0.2s ease;
        }
        body.dark .message-bubble { background: var(--dark-other-msg-bg); }
        .message.self .message-bubble { background: var(--self-msg-bg); color: white; }
        .message-image { max-width:200px; max-height:200px; border-radius:1rem; cursor:pointer; }
        .delete-msg {
            position:absolute; top:-6px; right:-6px;
            background: rgba(0,0,0,0.7); color:white; border-radius:50%;
            width:22px; height:22px; display:flex; align-items:center;
            justify-content:center; font-size:11px; cursor:pointer;
            opacity:0; transition:all 0.2s ease; border:none;
        }
        .message:hover .delete-msg { opacity:1; }

        .input-area { padding:1rem 1.5rem; border-top:1px solid rgba(0,0,0,0.06); display:flex; flex-direction:column; gap:0.5rem; }
        body.dark .input-area { border-top-color:rgba(255,255,255,0.06); }
        .input-toolbar { display:flex; gap:0.5rem; align-items:center; }
        .tool-btn {
            background: rgba(0,0,0,0.05); border:none; width:38px; height:38px;
            border-radius:50%; font-size:1.2rem; cursor:pointer;
            display:inline-flex; align-items:center; justify-content:center;
            transition:all 0.2s ease;
        }
        .tool-btn:hover { background: rgba(255,127,127,0.2); transform:scale(1.1); }
        body.dark .tool-btn { background: rgba(255,255,255,0.08); color:white; }
        body.dark .tool-btn:hover { background: rgba(138,154,91,0.2); }
        .input-row { display:flex; gap:0.5rem; }
        .input-row input {
            flex:1; padding:14px 18px; border-radius:3rem;
            border:2px solid #e8d5d0; background:rgba(255,255,255,0.8);
            outline:none; font-size:0.95rem; transition:all 0.3s ease;
        }
        body.dark .input-row input { background:rgba(30,32,44,0.8); border-color:#3a4a35; color:white; }
        .input-row input:focus { border-color:var(--input-focus); box-shadow:0 0 0 3px var(--input-focus-shadow); }
        .input-row button { width:auto; padding:0 1.8rem; }
        .emoji-picker {
            position:absolute; bottom:80px; background:rgba(255,255,255,0.95);
            backdrop-filter:blur(20px); border-radius:1rem;
            box-shadow:0 10px 30px rgba(0,0,0,0.2); padding:10px;
            display:none; grid-template-columns:repeat(8,1fr); gap:4px;
            z-index:10; border:1px solid rgba(255,127,127,0.2);
        }
        body.dark .emoji-picker { background:rgba(30,32,45,0.95); border-color:rgba(138,154,91,0.2); }
        .emoji-picker span { font-size:1.4rem; cursor:pointer; text-align:center; padding:4px; border-radius:0.5rem; transition:all 0.2s ease; }
        .emoji-picker span:hover { background:rgba(255,127,127,0.2); transform:scale(1.3); }

        /* ===== 世界观面板 ===== */
        .world-view {
            flex:1; overflow-y:auto; padding:1.5rem;
            background: var(--bg-gradient);
            background-size: var(--bg-gradient-size);
            animation: var(--bg-animation);
            display:flex; flex-direction:column; gap:1rem;
            position:relative;
        }
        body.dark .world-view { background: var(--dark-bg-gradient); background-size: var(--bg-gradient-size); animation: var(--bg-animation); }
        .world-view::before {
            content:''; position:absolute; top:0; left:0; width:100%; height:100%;
            pointer-events:none; z-index:0;
            opacity: var(--pattern-opacity, 1);
            display: var(--pattern-display, none);

        { id:5, title:"城界禁令", content:"公民活动范围仅限环城之内。严禁踏出环城半步。外界之城乃污秽与虚无之地，勿存好奇。", characters:[], images:[] },
        { id:6, title:"夜都", content:"环城地下的巨大废墟都会，没有招牌的店铺交易着环城禁止的一切——机密文件、黑科技、被篡改的记忆。隙民常在此接活。", characters:["无名店主","酒保"], images:[] }
    ];

    // ===== 用户系统 =====
    async function register(id, pwd) {
        if (!/^[a-zA-Z0-9_]+$/.test(id)) return { success:false, msg:"ID只能字母数字下划线" };
        const { data } = await supabase.from('users').select('id').eq('id', id);
        if (data && data.length > 0) return { success:false, msg:"ID已存在" };
        await supabase.from('users').insert({ id, pwd, theme:'ringcity', unlocked_themes:['ringcity'] });
        return { success:true };
    }

    async function login(id, pwd) {
        const { data } = await supabase.from('users').select('*').eq('id', id).eq('pwd', pwd);
        if (!data || data.length === 0) return { success:false, msg:"ID或密码错误" };
        const user = data[0];
        currentTheme = user.theme || 'ringcity';
        unlockedThemes = user.unlocked_themes || ['ringcity'];
        applyTheme(currentTheme);
        return { success:true };
    }

    async function getUsers() {
        const { data } = await supabase.from('users').select('id');
        const users = {};
        (data||[]).forEach(u => { users[u.id] = u; });
        return users;
    }

    async function saveTheme(themeId) {
        if (!currentUser) return;
        await supabase.from('users').update({ theme:themeId }).eq('id', currentUser.id);
    }

    async function saveUnlockedThemes() {
        if (!currentUser) return;
        await supabase.from('users').update({ unlocked_themes:unlockedThemes }).eq('id', currentUser.id);
    }

    // ===== 主题系统 =====
    function applyTheme(themeId) {
        document.body.className = document.body.className
            .replace(/theme-\S+/g, '')
            .replace(/\s+/g, ' ')
            .trim();
        if (themeId !== 'ringcity') {
            document.body.classList.add(`theme-${themeId}`);
        }
        currentTheme = themeId;
        if (document.body.classList.contains('dark')) {
            document.body.classList.add('dark');
        }
    }

    function openThemeSelector() {
        document.getElementById('themeSelectorOverlay').style.display = 'flex';
        renderThemeGrid();
        document.getElementById('giftSection').style.display = isGifter() ? 'flex' : 'none';
    }

    function closeThemeSelector() {
        document.getElementById('themeSelectorOverlay').style.display = 'none';
    }

    function isGifter() { return currentUser && MODERATORS.includes(currentUser.id); }

    function renderThemeGrid() {
        const grid = document.getElementById('themeGrid');
        grid.innerHTML = '';
        THEMES.forEach(theme => {
            const isUnlocked = unlockedThemes.includes(theme.id);
            const isSelected = currentTheme === theme.id;
            const div = document.createElement('div');
            div.className = `theme-preview ${isSelected ? 'selected' : ''} ${!isUnlocked ? 'locked' : ''}`;
            div.innerHTML = `
                <div class="preview-swatch" style="background:${theme.swatch};"></div>
                <div class="preview-name">${theme.emoji} ${theme.name}</div>
                ${!isUnlocked ? '<div class="preview-badge">🔒</div>' : ''}
                ${isSelected ? '<div class="preview-badge" style="background:var(--input-focus);">✓</div>' : ''}
            `;
            if (isUnlocked) {
                div.onclick = async () => {
                    applyTheme(theme.id);
                    await saveTheme(theme.id);
                    renderThemeGrid();
                };
            }
            grid.appendChild(div);
        });
    }

    async function giftTheme() {
        if (!isGifter()) return;
        const userId = document.getElementById('giftUserId').value.trim();
        const themeId = document.getElementById('giftThemeSelect').value;
        if (!userId) return alert('请输入对方ID');
        const { data } = await supabase.from('users').select('*').eq('id', userId);
        if (!data || data.length === 0) return alert('用户不存在');
        const user = data[0];
        const themes = user.unlocked_themes || ['ringcity'];
        if (themes.includes(themeId)) return alert('对方已拥有该主题');
        themes.push(themeId);
        await supabase.from('users').update({ unlocked_themes: themes }).eq('id', userId);
        alert(`✅ 已赠送「${THEMES.find(t=>t.id===themeId)?.name}」给 ${userId}`);
    }

    // ===== 消息系统 =====
    async function sendTextMessage(content) {
        if (!content.trim()) return;
        await supabase.from('messages').insert({ from:currentUser.id, type:'text', content:content.trim(), timestamp:Date.now() });
    }

    async function sendImageMessage(base64) {
        await supabase.from('messages').insert({ from:currentUser.id, type:'image', content:base64, timestamp:Date.now() });
    }

    async function loadMessages() {
        const { data } = await supabase.from('messages').select('*').order('timestamp', { ascending:true });
        renderMessagesFromArray(data || []);
    }

    function renderMessagesFromArray(msgs) {
        const container = document.getElementById('chatMessages');
        if (!container) return;
        const isMod = currentUser && MODERATORS.includes(currentUser.id);
        container.innerHTML = '';
        msgs.forEach(msg => {
            const isSelf = currentUser && msg.from === currentUser.id;
            const div = document.createElement('div');
            div.className = `message ${isSelf?'self':'other'}`;
            const info = document.createElement('div');
            info.className = 'message-info';
            const ns = document.createElement('span');
            ns.innerText = msg.from;
            if (MODERATORS.includes(msg.from)) {
                const b = document.createElement('span');
                b.innerText = '审核员';
                b.style.cssText = 'font-size:0.65rem;background:var(--badge-gradient);color:white;padding:2px 8px;border-radius:1rem;margin-left:6px;';
                ns.appendChild(b);
            }
            const ts = document.createElement('span');
            const d = new Date(msg.timestamp);
            ts.innerText = `${d.getMonth()+1}/${d.getDate()} ${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`;
            info.appendChild(ns); info.appendChild(ts);
            const bubble = document.createElement('div');
            bubble.className = 'message-bubble';
            if (msg.type==='image') {
                const img = document.createElement('img');
                img.src = msg.content; img.className = 'message-image'; img.alt = 'image';
                bubble.appendChild(img);
            } else bubble.innerText = msg.content;
            div.appendChild(info); div.appendChild(bubble);
            if (isMod) {
                const del = document.createElement('button');
                del.className = 'delete-msg'; del.innerText = '✕';
                del.onclick = async (e) => {
                    e.stopPropagation();
                    if (confirm('删除这条消息？')) {
                        await supabase.from('messages').delete().eq('timestamp', msg.timestamp).eq('from', msg.from);
                        loadMessages();
                    }
                };
                div.appendChild(del);
            }
            container.appendChild(div);
        });
        container.scrollTop = container.scrollHeight;
    }

    function listenMessages() {
        supabase.channel('messages-channel')
            .on('postgres_changes', { event:'INSERT', schema:'public', table:'messages' }, () => loadMessages())
            .subscribe();
        loadMessages();
    }

    // ===== 用户列表 =====
    async function renderUserList() {
        const container = document.getElementById('userList');
        if (!container) return;
        const users = await getUsers();
        const kw = (document.getElementById('searchUserInput')?.value||'').toLowerCase();
        const filtered = Object.values(users).filter(u => u.id.toLowerCase().includes(kw));
        container.innerHTML = '';
        filtered.forEach(u => {
            const div = document.createElement('div');
            div.className = 'user-item';
            div.innerHTML = `<div class="user-name">${u.id}</div>${MODERATORS.includes(u.id)?'<span class="role-badge">审核员</span>':''}`;
            container.appendChild(div);
        });
    }

    // ===== 世界观 =====
    async function getWorld() {
        const { data } = await supabase.from('world').select('data').eq('id',1).single();
        return data ? data.data : JSON.parse(JSON.stringify(defaultWorld));
    }

    async function saveWorld(data) { await supabase.from('world').upsert({ id:1, data }); }

    async function renderWorldCards() {
        const container = document.getElementById('worldCards');
        if (!container) return;
        const data = await getWorld();
        const kw = (document.getElementById('worldSearch')?.value||'').toLowerCase();
        const filtered = data.filter(i =>
            i.title.toLowerCase().includes(kw) ||
            i.content.toLowerCase().includes(kw) ||
            (i.characters||[]).some(c=>c.toLowerCase().includes(kw))
        );
        container.innerHTML = '';
        filtered.forEach(item => {
            const card = document.createElement('div');
            card.className = 'world-card';
            card.onclick = () => showDetail(item);
            card.innerHTML = `
                <h3>📄 ${item.title}</h3>
                <p>${item.content}</p>
                ${(item.images||[]).length>0?`<div class="card-images">${item.images.slice(0,3).map(i=>`<img src="${i}" alt="pic">`).join('')}</div>`:''}
            `;
            container.appendChild(card);
        });
        const addArea = document.getElementById('addCardArea');
        if (addArea && isEditor()) addArea.innerHTML = `<div class="add-card-btn" onclick="addWorldItem()">+ 新增条目</div>`;
        else if (addArea) addArea.innerHTML = '';
    }

    function showDetail(item) {
        const overlay = document.createElement('div');
        overlay.className = 'modal-overlay';
        overlay.innerHTML = `
            <div class="modal-content">
                <button class="modal-close">✕</button>
                <h2>${item.title}</h2>
                <p style="margin-top:1rem;line-height:1.8;">${item.content}</p>
                ${(item.images||[]).length>0?`<div class="modal-images">${item.images.map(i=>`<img src="${i}" alt="detail">`).join('')}</div>`:''}
                ${(item.characters||[]).length>0?`<div class="modal-characters"><strong>相关角色：</strong>${item.characters.map(c=>`<span class="char-tag">${c}</span>`).join('')}</div>`:''}
                <div style="margin-top:1.5rem;">
                    <strong>📤 上传图片：</strong>
                    <input type="file" accept="image/*" onchange="uploadImageForItem(${item.id}, this)" style="display:block;margin-top:0.5rem;" />
                    <span style="font-size:0.8rem;color:var(--text-muted);">提交后需审核员批准</span>
                </div>
                ${isEditor()?`<div style="margin-top:1rem;display:flex;gap:0.5rem;"><button onclick="editWorldItem(${item.id})">✏️ 编辑</button><button onclick="deleteWorldItem(${item.id});document.querySelector('.modal-overlay').remove();">🗑️ 删除</button></div>`:''}
            </div>
        `;
        document.body.appendChild(overlay);
        overlay.querySelector('.modal-close').onclick = () => overlay.remove();
        overlay.addEventListener('click', e => { if (e.target===overlay) overlay.remove(); });
    }

    window.uploadImageForItem = function(id, input) {
        const file = input.files[0];
        if (!file||!file.type.startsWith('image/')) return;
        const reader = new FileReader();
        reader.onload = async (e) => {
            await supabase.from('pending_images').insert({ itemId:id, image:e.target.result, timestamp:Date.now(), uploader:currentUser.id });
            alert('✅ 图片已提交审核。');
            input.value = '';
            updateReviewBadge();
        };
        reader.readAsDataURL(file);
    };

    // ===== 审核 =====
    async function updateReviewBadge() {
        const badge = document.getElementById('reviewBadge');
        if (!badge||!isEditor()) { if(badge) badge.style.display='none'; return; }
        const { data } = await supabase.from('pending_images').select('*');
        const count = (data||[]).length;
        badge.style.display = 'inline-block';
        badge.innerText = `📸 待审核 (${count})`;
        if (count>0) badge.classList.add('has-pending'); else badge.classList.remove('has-pending');
        badge.onclick = toggleReviewDrawer;
    }

    function toggleReviewDrawer() {
        const drawer = document.getElementById('reviewDrawer');
        drawer.classList.toggle('open');
        if (drawer.classList.contains('open')) renderReviewContent();
    }

    async function renderReviewContent() {
        const container = document.getElementById('reviewDrawerContent');
        const { data } = await supabase.from('pending_images').select('*');
        if (!data||data.length===0) { container.innerHTML='<p style="color:var(--text-muted);">暂无待审图片。</p>'; return; }
        container.innerHTML = '';
        data.forEach(item => {
            const div = document.createElement('div');
            div.className = 'review-item';
            div.innerHTML = `
                <div style="flex:1;">
                    <div style="font-size:0.8rem;">条目ID: ${item.itemId}</div>
                    <div style="font-size:0.75rem;">上传者: ${item.uploader}</div>
                    <img src="${item.image}" style="height:50px;border-radius:0.8rem;margin-top:0.3rem;">
                </div>
                <div style="display:flex;gap:0.3rem;">
                    <button style="background:#10b981;" onclick="approveImage('${item.timestamp}')">通过</button>
                    <button style="background:#ef4444;" onclick="rejectImage('${item.timestamp}')">拒绝</button>
                </div>
            `;
            container.appendChild(div);
        });
    }

    window.approveImage = async function(timestamp) {
        const { data } = await supabase.from('pending_images').select('*').eq('timestamp', timestamp);
        if (!data||data.length===0) return;
        const item = data[0];
        const worldData = await getWorld();
        const target = worldData.find(d=>d.id===item.itemId);
        if (target) { target.images = target.images||[]; target.images.push(item.image); await saveWorld(worldData); }
        await supabase.from('pending_images').delete().eq('timestamp', timestamp);
        renderReviewContent(); renderWorldCards(); updateReviewBadge();
    };

    window.rejectImage = async function(timestamp) {
        await supabase.from('pending_images').delete().eq('timestamp', timestamp);
        renderReviewContent(); updateReviewBadge();
    };

    // ===== 条目编辑 =====
    window.addWorldItem = async function() {
        const title = prompt('条目标题：'); if (!title) return;
        const content = prompt('条目内容：'); if (!content) return;
        const chars = prompt('相关角色（逗号分隔）：')||'';
        const data = await getWorld();
        data.push({ id:Math.max(...data.map(i=>i.id),0)+1, title, content, characters:chars.split(',').map(s=>s.trim()).filter(Boolean), images:[] });
        await saveWorld(data); renderWorldCards();
    };

    window.editWorldItem = async function(id) {
        const data = await getWorld(); const item = data.find(i=>i.id===id); if (!item) return;
        const title = prompt('标题：', item.title); if (title===null) return;
        const content = prompt('内容：', item.content); if (content===null) return;
        item.title = title; item.content = content;
        await saveWorld(data); renderWorldCards();
    };

    window.deleteWorldItem = async function(id) {
        if (!confirm('确定删除？')) return;
        let data = await getWorld(); data = data.filter(i=>i.id!==id);
        await saveWorld(data); renderWorldCards();
    };

    function isEditor() { return currentUser && MODERATORS.includes(currentUser.id); }

    // ===== 表情和图片 =====
    function buildEmojiPicker() {
        const emojis = '😀😃😂🤣😊😇😍🥰😘🙂🤗😐😑😶🙄😏😣😥😮😯😪😫😴😌😛😜😝🤤😒😓😔😕🙃🤑😲☹️😤😢😭😦😧😨😩😰😱🥵🥶😳😵😡😠🤬😷🤒🤕🤢🤮😈👿👻💀👽🤖💩😺😸😹😻😼😽🙀😿😾'.split('');
        const container = document.getElementById('emojiPicker');
        container.innerHTML = '';
        emojis.forEach(e => {
            const span = document.createElement('span');
            span.innerText = e;
            span.onclick = () => {
                document.getElementById('messageInput').value += e;
                container.style.display = 'none';
                document.getElementById('messageInput').focus();
            };
            container.appendChild(span);
        });
    }

    function setupImageUpload() {
        document.getElementById('imageUploadBtn').onclick = () => document.getElementById('imageInput').click();
        document.getElementById('imageInput').onchange = e => {
            const file = e.target.files[0];
            if (file?.type.startsWith('image/')) {
                const reader = new FileReader();
                reader.onload = ev => { sendImageMessage(ev.target.result); e.target.value = ''; };
                reader.readAsDataURL(file);
            }
        };
    }

    // ===== 瑞茨尔主题猫爪特效 =====
    function setupRitzPawEffect() {
        document.addEventListener('click', function(e) {
            if (currentTheme !== 'ritzlicht') return;
            const paw = document.createElement('div');
            paw.style.cssText = `
                position:fixed; left:${e.clientX-10}px; top:${e.clientY-10}px;
                width:20px; height:20px; pointer-events:none; z-index:9999;
                font-size:20px; animation:pawFade 1s ease forwards;
                color:${Math.random()>0.5?'#0047ab':'#d4a843'};
            `;
            paw.innerText = 'ฅ';
            document.body.appendChild(paw);
            setTimeout(() => paw.remove(), 1000);
        });
        const style = document.createElement('style');
        style.textContent = '@keyframes pawFade{0%{transform:scale(0.5);opacity:1;}50%{transform:scale(1.5);opacity:0.8;}100%{transform:scale(2);opacity:0;}}';
        document.head.appendChild(style);
    }

    // ===== 时间简史时钟 =====
    function setupBriefHistoryClock() {
        const worldView = document.querySelector('.world-view');
        if (!worldView) return;
        let clockEl = document.getElementById('briefHistoryClock');
        if (!clockEl) {
            clockEl = document.createElement('div');
            clockEl.id = 'briefHistoryClock';
            clockEl.style.cssText = 'position:absolute;top:50%;right:10%;width:200px;height:200px;pointer-events:none;z-index:0;opacity:0.3;';
            worldView.appendChild(clockEl);
        }
        function updateClock() {
            if (currentTheme !== 'brief-history') { clockEl.style.display = 'none'; return; }
            clockEl.style.display = 'block';
            const now = new Date();
            const secondsAngle = now.getSeconds() * 6;
            clockEl.innerHTML = `
                <svg width="200" height="200" viewBox="0 0 200 200">
                    <circle cx="100" cy="100" r="90" fill="none" stroke="#d4af37" stroke-width="1"/>
                    ${['XII','I','II','III','IV','V','VI','VII','VIII','IX','X','XI'].map((num,i)=>{
                        const angle = i*30*Math.PI/180;
                        const x = 100+80*Math.sin(angle);
                        const y = 100-80*Math.cos(angle);
                        return `<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="central" fill="#d4af37" font-size="10" font-family="serif">${num}</text>`;
                    }).join('')}
                    <line x1="100" y1="100" x2="100" y2="30" stroke="#d4af37" stroke-width="1.5" transform="rotate(${secondsAngle},100,100)"/>
                </svg>
            `;
        }
        setInterval(updateClock, 1000);
        updateClock();
    }

    // ===== 萤火之森光点呼吸 =====
    function setupFireflyEffect() {
        setInterval(() => {
            if (currentTheme !== 'firefly-forest') return;
            const worldView = document.querySelector('.world-view');
            if (!worldView) return;
            const dots = worldView.querySelectorAll('.firefly-dot');
            dots.forEach(dot => {
                const opacity = 0.3 + Math.random() * 0.5;
                dot.style.opacity = opacity;
            });
        }, 2000);
    }

    // ===== 启动 =====
    async function startChat(userId) {
        currentUser = { id:userId };
        localStorage.setItem('lastUser', userId);
        document.getElementById('authView').style.display = 'none';
        document.getElementById('chatView').style.display = 'flex';
        document.getElementById('currentUserName').innerText = userId;
        await renderUserList();
        switchTab('chat');
        document.getElementById('searchUserInput').addEventListener('input', renderUserList);
        document.getElementById('sendMsgBtn').onclick = () => {
            sendTextMessage(document.getElementById('messageInput').value);
            document.getElementById('messageInput').value = '';
        };
        document.getElementById('messageInput').onkeypress = e => {
            if (e.key==='Enter') {
                sendTextMessage(document.getElementById('messageInput').value);
                document.getElementById('messageInput').value = '';
            }
        };
        const emojiBtn = document.getElementById('emojiBtn'), emojiPicker = document.getElementById('emojiPicker');
        emojiBtn.onclick = e => { e.stopPropagation(); emojiPicker.style.display = emojiPicker.style.display==='grid'?'none':'grid'; };
        document.addEventListener('click', e => { if (!emojiPicker.contains(e.target)&&e.target!==emojiBtn) emojiPicker.style.display = 'none'; });
        buildEmojiPicker();
        setupImageUpload();
        document.getElementById('worldSearch').addEventListener('input', renderWorldCards);
        document.getElementById('themePaletteBtn').onclick = openThemeSelector;
        document.getElementById('themeSelectorOverlay').addEventListener('click', e => { if (e.target===document.getElementById('themeSelectorOverlay')) closeThemeSelector(); });
        setupRitzPawEffect();
        setupBriefHistoryClock();
        setupFireflyEffect();
        await renderWorldCards();
        await updateReviewBadge();
        listenMessages();
    }

    function logout() {
        currentUser = null;
        currentTheme = 'ringcity';
        unlockedThemes = ['ringcity'];
        applyTheme('ringcity');
        localStorage.removeItem('lastUser');
        document.getElementById('authView').style.display = 'flex';
        document.getElementById('chatView').style.display = 'none';
    }

    function switchTab(tab) {
        const cp = document.getElementById('chatPanel'), wp = document.getElementById('worldPanel');
        const cb = document.getElementById('chatTabBtn'), wb = document.getElementById('worldTabBtn');
        if (tab==='chat') {
            cp.style.display = 'block'; wp.style.display = 'none';
            cb.classList.add('active'); wb.classList.remove('active');
        } else {
            cp.style.display = 'none'; wp.style.display = 'flex'; wp.style.flexDirection = 'column';
            cb.classList.remove('active'); wb.classList.add('active');
            renderWorldCards(); updateReviewBadge();
        }
    }

    function initThemeToggle() {
        const isDark = localStorage.getItem('theme')==='dark';
        if (isDark) document.body.classList.add('dark');
        const btn = document.getElementById('themeToggleBtn');
        if (btn) {
            btn.innerText = isDark ? '☀️' : '🌙';
            btn.onclick = () => {
                document.body.classList.toggle('dark');
                const nowDark = document.body.classList.contains('dark');
                localStorage.setItem('theme', nowDark?'dark':'light');
                btn.innerText = nowDark ? '☀️' : '🌙';
            };
        }
    }

    // ===== 初始化数据库 =====
    async function initDatabase() {
        const { data } = await supabase.from('world').select('id').eq('id',1).single();
        if (!data) await supabase.from('world').insert({ id:1, data:defaultWorld });
    }

    // ===== 绑定认证 =====
    function bindAuth() {
        document.getElementById('showLoginBtn').onclick = () => {
            document.getElementById('loginPanel').style.display='block';
            document.getElementById('registerPanel').style.display='none';
        };
        document.getElementById('showRegisterBtn').onclick = () => {
            document.getElementById('loginPanel').style.display='none';
            document.getElementById('registerPanel').style.display='block';
        };
        document.getElementById('switchToRegister').onclick = () => {
            document.getElementById('loginPanel').style.display='none';
            document.getElementById('registerPanel').style.display='block';
        };
        document.getElementById('doLoginBtn').onclick = async () => {
            const id = document.getElementById('loginId').value.trim();
            const pwd = document.getElementById('loginPwd').value;
            const res = await login(id, pwd);
            if (res.success) startChat(id);
            else document.getElementById('loginError').innerText = res.msg;
        };
        document.getElementById('doRegisterBtn').onclick = async () => {
            const id = document.getElementById('regId').value.trim();
            const pwd = document.getElementById('regPwd').value;
            const res = await register(id, pwd);
            if (res.success) {
                alert('注册成功！请登录');
                document.getElementById('loginPanel').style.display='block';
                document.getElementById('registerPanel').style.display='none';
            } else document.getElementById('regError').innerText = res.msg;
        };
        document.getElementById('logoutBtn').onclick = logout;
        document.getElementById('chatTabBtn').onclick = () => switchTab('chat');
        document.getElementById('worldTabBtn').onclick = () => switchTab('world');
    }

    // ===== 全部启动 =====
    bindAuth();
    initThemeToggle();
    initDatabase();
    setupRitzPawEffect();
    setupBriefHistoryClock();
    setupFireflyEffect();

  const lastUser = localStorage.getItem('lastUser');
if (lastUser) {
    login(lastUser, '').then(res => {
        if (!res.success) {
            // 自动登录失败，清除记录，显示登录界面
            localStorage.removeItem('lastUser');
            document.getElementById('authView').style.display = 'flex';
            document.getElementById('chatView').style.display = 'none';
            return;
        }

        startChat(lastUser);
    });
}</script>
</body>
</html>
