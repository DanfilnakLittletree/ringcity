<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>环城 · 社团通讯</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm" type="module"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        :root {
            --bg: #f0f2f5; --surface: #fff; --surface2: #f5f5f5; --text: #1e293b;
            --text2: #64748b; --border: #e2e8f0; --accent: #FF7F7F; --msg-self: #FF7F7F;
            --msg-other: #e4e6eb; --sidebar-bg: #f8fafc; --chat-bg: #fff;
        }
        body.dark {
            --bg: #0f1217; --surface: #1a1c28; --surface2: #242636; --text: #eef;
            --text2: #94a3b8; --border: #2c2e40; --accent: #c04040; --msg-self: #c04040;
            --msg-other: #2c2e3e; --sidebar-bg: #141622; --chat-bg: #1a1c28;
        }
        body {
            font-family:'Segoe UI',system-ui,sans-serif;
            background:var(--bg); color:var(--text);
            min-height:100vh; transition:all 0.3s;
        }
        .app-bg { position:fixed; top:0; left:0; width:100%; height:100%; z-index:-1; background:var(--bg); }
        .app-container { max-width:1000px; margin:0 auto; padding:0.5rem; height:100vh; display:flex; flex-direction:column; }
        .auth-card {
            max-width:400px; margin:auto; background:var(--surface);
            border-radius:1.5rem; padding:2rem; text-align:center;
            box-shadow:0 10px 30px rgba(0,0,0,0.1);
        }
        input,select,textarea {
            width:100%; padding:10px; margin:5px 0; border-radius:8px;
            border:1px solid var(--border); background:var(--surface2);
            color:var(--text); font-size:0.95rem; font-family:inherit;
        }
        button {
            padding:10px 16px; border:none; border-radius:8px;
            background:var(--accent); color:white; font-weight:600;
            cursor:pointer; font-size:0.9rem;
        }
        button:hover { opacity:0.85; }
        .chat-layout {
            display:flex; gap:0.5rem; height:100%;
            background:var(--chat-bg); border-radius:1rem;
            padding:0.5rem; overflow:hidden; transition:opacity 0.3s;
        }
        .chat-layout.hidden-chat { opacity:0; pointer-events:none; }
        .sidebar {
            width:200px; background:var(--sidebar-bg); border-radius:0.8rem;
            padding:0.5rem; overflow-y:auto; display:flex; flex-direction:column; flex-shrink:0;
        }
        .sidebar h3 { margin-bottom:0.5rem; font-size:0.85rem; }
        .user-item {
            padding:0.3rem 0.5rem; border-radius:0.5rem;
            display:flex; align-items:center; gap:0.3rem; font-size:0.8rem;
        }
        .user-item:hover { background:rgba(128,128,128,0.1); }
        .online-dot { width:6px; height:6px; border-radius:50%; flex-shrink:0; }
        .user-avatar { width:22px; height:22px; border-radius:50%; object-fit:cover; flex-shrink:0; }
        .title-tag { font-size:0.55rem; background:var(--accent); color:white; padding:1px 5px; border-radius:0.5rem; opacity:0.8; }
        .main-area { flex:1; display:flex; flex-direction:column; min-width:0; overflow:hidden; }
        .top-bar {
            display:flex; gap:0.3rem; margin-bottom:0.4rem;
            align-items:center; flex-shrink:0; flex-wrap:wrap;
        }
        .tab-btn {
            padding:0.3rem 0.7rem; border-radius:0.5rem;
            background:var(--surface2); border:none; color:var(--text2);
            cursor:pointer; font-size:0.75rem;
        }
        .tab-btn.active { background:var(--accent); color:white; }
        .announce-bar {
            background:rgba(245,158,11,0.15); padding:0.3rem 0.6rem;
            border-radius:0.5rem; margin-bottom:0.4rem; font-size:0.75rem;
            overflow:hidden; white-space:nowrap; flex-shrink:0;
        }
        .chat-messages {
            flex:1; overflow-y:auto; padding:0.4rem;
            display:flex; flex-direction:column; gap:0.5rem; min-height:0;
        }
        .message { max-width:80%; flex-shrink:0; }
        .message.self { align-self:flex-end; }
        .message-bubble {
            background:var(--msg-other); padding:0.4rem 0.7rem;
            border-radius:0.7rem; font-size:0.8rem; word-wrap:break-word;
        }
        .message.self .message-bubble { background:var(--msg-self); color:white; }
        .message-info { font-size:0.6rem; opacity:0.6; margin-bottom:0.1rem; }
        .input-area { display:flex; gap:0.4rem; margin-top:0.4rem; flex-shrink:0; }
        .input-area input { flex:1; margin:0; }
        .input-area button { width:auto; }
        .modal-overlay {
            position:fixed; top:0; left:0; width:100%; height:100%;
            background:rgba(0,0,0,0.6); z-index:100;
            display:flex; align-items:center; justify-content:center;
        }
        .modal-box {
            background:var(--surface); border-radius:1rem; padding:1.5rem;
            max-width:500px; width:92%; max-height:85vh; overflow-y:auto;
        }
        .guestbook-item {
            background:var(--surface2); padding:0.4rem 0.6rem;
            border-radius:0.5rem; margin-bottom:0.3rem; font-size:0.8rem;
        }
        .archive-detail {
            background:var(--surface2); padding:0.8rem; border-radius:0.8rem;
            margin-top:0.3rem; font-size:0.85rem; line-height:1.5;
        }
        .footer-note { text-align:center; padding:0.3rem; font-size:0.6rem; opacity:0.3; }
        .hide-chat-btn {
            position:fixed; bottom:5rem; right:1rem; z-index:50;
            width:40px; height:40px; border-radius:50%;
            background:rgba(0,0,0,0.5); color:white; border:none;
            font-size:1.2rem; cursor:pointer;
            display:flex; align-items:center; justify-content:center;
        }
        .bottom-nav {
            display:none; position:fixed; bottom:0; left:0; right:0;
            background:var(--surface); border-top:1px solid var(--border);
            padding:0.4rem; z-index:50; justify-content:space-around;
        }
        .bottom-nav button {
            background:none; color:var(--text2); font-size:0.7rem;
            display:flex; flex-direction:column; align-items:center;
            gap:0.1rem; padding:0.3rem;
        }
        .bottom-nav button.active { color:var(--accent); }
        .crop-overlay {
            position:fixed; top:0; left:0; width:100%; height:100%;
            background:rgba(0,0,0,0.8); z-index:200;
            display:flex; align-items:center; justify-content:center; flex-direction:column;
        }
        .crop-container {
            position:relative; width:280px; height:280px; overflow:hidden; border-radius:1rem;
        }
        .crop-container img { position:absolute; max-width:none; }
        .crop-frame {
            position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
            width:200px; height:200px; border:2px dashed white;
            border-radius:50%; pointer-events:none;
        }
        .theme-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(100px,1fr)); gap:0.5rem; }
        .theme-card {
            padding:0.5rem; border-radius:0.8rem; cursor:pointer; text-align:center;
            border:2px solid transparent; background:var(--surface2);
            font-size:0.75rem; transition:all 0.2s;
        }
        .theme-card:hover { transform:translateY(-2px); }
        .theme-card.selected { border-color:var(--accent); }
        .theme-card .swatch { height:40px; border-radius:0.5rem; margin-bottom:0.3rem; }
        @media (max-width:768px) {
            .sidebar { display:none; }
            .bottom-nav { display:flex; }
            .app-container { padding-bottom:3.5rem; }
            .message { max-width:90%; }
            .hide-chat-btn { bottom:5rem; }
        }
    </style>
</head>
<body>
<div class="app-bg"></div>
<button class="hide-chat-btn" onclick="toggleChat()" title="隐藏/显示聊天">👁️</button>
<div id="app">
    <div id="authView" class="app-container" style="justify-content:center;">
        <div class="auth-card">
            <h2>🏛️ 环城社团通讯</h2>
            <p style="opacity:0.6;margin-bottom:1rem;">秩序之光，永远照耀环城</p>
            <input type="text" id="loginId" placeholder="ID">
            <input type="password" id="loginPwd" placeholder="密码">
            <button onclick="doLogin()">登录</button>
            <button onclick="showRegister()" style="background:var(--surface2);color:var(--text);margin-top:0.3rem;">注册</button>
            <p id="loginError" style="color:#ef4444;font-size:0.8rem;"></p>
        </div>
    </div>
    <div id="chatView" class="app-container" style="display:none;">
        <div class="chat-layout" id="chatLayout">
            <div class="sidebar" id="sidebar">
                <h3>👥 成员</h3>
                <input type="text" id="userSearch" placeholder="搜索..." style="font-size:0.75rem;padding:6px;">
                <div id="userList" style="flex:1;overflow-y:auto;margin-top:0.3rem;"></div>
                <button onclick="logout()" style="margin-top:0.5rem;font-size:0.7rem;background:var(--surface2);color:var(--text);">登出</button>
            </div>
            <div class="main-area">
                <div class="top-bar">
                    <span style="font-weight:600;font-size:0.85rem;">环城通讯</span>
                    <span style="flex:1;"></span>
                    <button class="tab-btn active" data-tab="chat">💬 通讯</button>
                    <button class="tab-btn" data-tab="guestbook">📝 留言</button>
                    <button class="tab-btn" data-tab="archive">📖 档案</button>
                    <span id="currentUserDisplay" style="font-size:0.75rem;opacity:0.7;cursor:pointer;" onclick="openProfile()"></span>
                    <button onclick="openThemePanel()" style="background:none;font-size:1rem;">🎨</button>
                    <button onclick="toggleDark()" style="background:none;font-size:1rem;">🌙</button>
                    <button id="adminBtn" onclick="openAdminPanel()" style="display:none;background:none;">⚙️</button>
                </div>
                <div id="announceBar" class="announce-bar" style="display:none;"></div>
                <div id="chatPanel">
                    <div class="chat-messages" id="chatMessages"><p style="text-align:center;opacity:0.5;padding:2rem;">暂无消息</p></div>
                    <div class="input-area">
                        <input type="text" id="messageInput" placeholder="输入消息...">
                        <button onclick="sendMessage()">发送</button>
                    </div>
                </div>
                <div id="guestbookPanel" style="display:none;flex:1;overflow-y:auto;padding:0.3rem;min-height:0;">
                    <div id="guestbookList"></div>
                    <div class="input-area">
                        <input type="text" id="guestbookInput" placeholder="在墙上留一句话...">
                        <button onclick="postGuestbook()">留言</button>
                    </div>
                </div>
                <div id="archivePanel" style="display:none;flex:1;overflow-y:auto;padding:0.3rem;min-height:0;">
                    <input type="text" id="worldSearch" placeholder="🔍 搜索档案..." style="margin-bottom:0.4rem;">
                    <div id="worldCards" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:0.4rem;"></div>
                </div>
            </div>
        </div>
    </div>
    <div class="bottom-nav" id="bottomNav">
        <button class="active" data-tab="chat">💬 通讯</button>
        <button data-tab="guestbook">📝 留言</button>
        <button data-tab="archive">📖 档案</button>
        <button onclick="openProfile()">👤 我</button>
        <button onclick="openThemePanel()">🎨</button>
        <button onclick="toggleDark()">🌙</button>
        <button id="adminBtnMobile" onclick="openAdminPanel()" style="display:none;">⚙️</button>
    </div>
</div>
<div class="footer-note">隙相·不归档·不保留·阅后即忘</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPABASE_URL = 'https://fflngacqldvyzvhpolch.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZmbG5nYWNxbGR2eXp2aHBvbGNoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE4ODQ3MTAsImV4cCI6MjA5NzQ2MDcxMH0.bkLyI6T4zNzClNlHqNO4O7wPu40Ep6xb2x5cUD0Hvgk';
const ringDB = createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: false } });
const MODERATORS = ["Danfilnak", "admin"];

let currentUser = null;
let currentTab = 'chat';
const renderedMsgIds = new Set();
let lastMsgTimestamp = 0;
let messageInterval = null;
let userInterval = null;

// HTML 转义（仅用于文本内容，不要转义 URL/Base64 图片）
function escapeHtml(unsafe) {
    return String(unsafe)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

// ========== 主题定义 ==========
const THEMES = [
    { id:'ringcity', name:'环城珊瑚', emoji:'🏛️', swatch:'linear-gradient(135deg,#FF7F7F,#8A9A5B)',
      colors: { accent:'#FF7F7F', msgSelf:'#FF7F7F', msgOther:'#e4e6eb', sidebarBg:'#f8fafc', chatBg:'#fff' } },
    { id:'swamp-witch', name:'沼泽巫女', emoji:'🔮', swatch:'linear-gradient(135deg,#1a0a2e,#c9a050)',
      colors: { accent:'#c9a050', msgSelf:'#1a0a2e', msgOther:'#e8d5b0', sidebarBg:'#f5efe6', chatBg:'#fcfaf5' } },
    { id:'brief-history', name:'时间简史', emoji:'⌛', swatch:'linear-gradient(180deg,#000,#fff)',
      colors: { accent:'#333', msgSelf:'#333', msgOther:'#e0e0e0', sidebarBg:'#fafafa', chatBg:'#fff' } },
    { id:'ferryman', name:'摆渡巫师', emoji:'⛩️', swatch:'linear-gradient(135deg,#e8734a,#1a3c2a)',
      colors: { accent:'#e8734a', msgSelf:'#e8734a', msgOther:'#e6d7cc', sidebarBg:'#fcf3ee', chatBg:'#fff9f5' } },
    { id:'strawberry-sweet', name:'草莓甜心', emoji:'❤', swatch:'linear-gradient(180deg,#fce4ec,#f48fb1)',
      colors: { accent:'#f48fb1', msgSelf:'#f48fb1', msgOther:'#ffe4ec', sidebarBg:'#fff0f3', chatBg:'#fff5f7' } },
    { id:'sunny-cloud', name:'晴天初云', emoji:'☁️', swatch:'linear-gradient(180deg,#bbdefb,#fff)',
      colors: { accent:'#64b5f6', msgSelf:'#64b5f6', msgOther:'#e3f2fd', sidebarBg:'#f0f8ff', chatBg:'#fff' } },
    { id:'rose-pink', name:'玫粉主题', emoji:'🌸', swatch:'linear-gradient(135deg,#e91e63,#f48fb1)',
      colors: { accent:'#e91e63', msgSelf:'#e91e63', msgOther:'#fce4ec', sidebarBg:'#fff0f3', chatBg:'#fff5f7' } },
    { id:'ritzlicht', name:'瑞茨尔专属', emoji:'🐱', swatch:'linear-gradient(135deg,#e3f2fd,#d4a843)',
      colors: { accent:'#d4a843', msgSelf:'#d4a843', msgOther:'#e3f2fd', sidebarBg:'#f5f0e1', chatBg:'#fffdf5' } },
    { id:'night-diner', name:'深夜食堂', emoji:'🍜', swatch:'linear-gradient(180deg,#1a2233,#f5a623)',
      colors: { accent:'#f5a623', msgSelf:'#f5a623', msgOther:'#2c2e3e', sidebarBg:'#1a1c28', chatBg:'#1e2130' } },
    { id:'star-rail', name:'星穹铁道', emoji:'🌌', swatch:'linear-gradient(180deg,#0a0a2e,#1e3a5f)',
      colors: { accent:'#5e9eff', msgSelf:'#5e9eff', msgOther:'#1a2040', sidebarBg:'#0f1525', chatBg:'#141c30' } },
    { id:'firefly-forest', name:'萤火之森', emoji:'🌿', swatch:'linear-gradient(180deg,#0a1a0a,#1a4a1a)',
      colors: { accent:'#7ec87e', msgSelf:'#7ec87e', msgOther:'#1a2a1a', sidebarBg:'#0f1f0f', chatBg:'#142014' } },
    { id:'vintage-film', name:'旧日胶片', emoji:'📷', swatch:'linear-gradient(180deg,#3a2a1a,#c8b898)',
      colors: { accent:'#c8b898', msgSelf:'#c8b898', msgOther:'#e6d7cc', sidebarBg:'#f5efe6', chatBg:'#fcfaf5' } }
];

const defaultWorld = [
    { id:1, title:"环城区域划分", content:"环城从内到外：天之柱→神域→中坚都市/内环→高街区/中环→外圈→暗巷→外界城→里界。地下有夜都，灰色地带的终极形态。各圈层由独立管理人统辖，法令与风俗各有差异。" },
    { id:2, title:"隙民 / 隙相", content:"活在环城规则缝隙中的族群。无固定身份，无身份章，擅长走私、偷渡、传话。理事会私下称其为「隙相(Gap-phase)」。他们不是被排斥的底层流民，而是主动选择游走在体系边缘的“规则玩家”。代表人物：利希塔·瑞茨尔（Lichta Ritzel），出生名弗里达·沃格尔（Frieda Vogel）。" },
    { id:3, title:"环三角", content:"环城的执法利刃，各圈均有部署。对环三角成员必须给予最高规格的礼遇与服从。神域边界由万斯独自看守——他掌握空间切割能力，已正式死亡277次，每次都在观测盲区中重新浮现。" },
    { id:4, title:"徽旗派(Emblem Flag)", content:"丽塔·多其米拉·尤尔特领导的组织，口号是消除阶级差异。内部团结参考太平天国模式。丽塔拥有「偷换概念」能力——能将语言中的定义替换，让人根本意识不到被换过。" },
    { id:5, title:"城界禁令", content:"公民活动范围仅限环城之内。严禁以任何形式踏出环城半步。外界之城，乃污秽与虚无之地。暗巷居民不具备公民资格。遵守规则，即是守护您的幸福。愿秩序之光，永远照耀环城。" },
    { id:6, title:"夜都", content:"环城地下的巨大废墟都会，官方地图上是一片空白。无数没有招牌的商店隐藏在阴影里，交易着环城禁止的一切——机密文件、黑科技、被篡改的记忆。隙民常在此接活。" }
];

// ===== 背景隐藏 =====
window.toggleChat = () => {
    document.getElementById('chatLayout').classList.toggle('hidden-chat');
    const btn = document.querySelector('.hide-chat-btn');
    btn.innerText = document.getElementById('chatLayout').classList.contains('hidden-chat') ? '👁️‍🗨️' : '👁️';
};

// ===== 日夜切换 =====
window.toggleDark = () => {
    document.body.classList.toggle('dark');
    localStorage.setItem('darkMode', document.body.classList.contains('dark'));
};

// ===== 注册 =====
window.showRegister = () => {
    const id = prompt('输入新ID（字母数字下划线）：');
    if (!id || !/^[a-zA-Z0-9_]+$/.test(id)) return alert('ID格式错误');
    const pwd = prompt('输入密码：');
    if (!pwd) return;
    ringDB.from('users').insert({ 
        id, pwd, 
        theme:'ringcity', 
        unlocked_themes:'["ringcity"]', 
        last_active: Date.now(), 
        title:'', status:'', avatar:'', 
        title_approved:false, avatar_approved:false 
    }).then(r => {
        if (r.error) return alert('注册失败：' + r.error.message);
        alert('✅ 注册成功！请登录');
    });
};

// ===== 登录 =====
window.doLogin = async () => {
    const id = document.getElementById('loginId').value.trim();
    const pwd = document.getElementById('loginPwd').value;
    const { data } = await ringDB.from('users').select('*').eq('id', id).eq('pwd', pwd);
    if (!data || data.length === 0) return document.getElementById('loginError').innerText = 'ID或密码错误';
    
    currentUser = data[0];
    if (!currentUser.unlocked_themes) currentUser.unlocked_themes = ['ringcity'];
    if (typeof currentUser.unlocked_themes === 'string') currentUser.unlocked_themes = JSON.parse(currentUser.unlocked_themes);
    
    document.getElementById('authView').style.display = 'none';
    document.getElementById('chatView').style.display = 'flex';
    updateCurrentUserDisplay();
    
    const isAdmin = MODERATORS.includes(currentUser.id);
    document.getElementById('adminBtn').style.display = isAdmin ? 'inline-block' : 'none';
    document.getElementById('adminBtnMobile').style.display = isAdmin ? 'flex' : 'none';
    
    await ringDB.from('users').update({ last_active: Date.now() }).eq('id', id);
    
    // 清除旧的定时器
    if (messageInterval) clearInterval(messageInterval);
    if (userInterval) clearInterval(userInterval);
    
    renderedMsgIds.clear(); 
    lastMsgTimestamp = 0;
    document.getElementById('chatMessages').innerHTML = '<p style="text-align:center;opacity:0.5;padding:2rem;">加载中...</p>';
    
    loadMessages(true); 
    loadUsers(); 
    loadAnnouncement(); 
    loadArchive();
    
    messageInterval = setInterval(() => loadMessages(false), 3000);
    userInterval = setInterval(loadUsers, 15000);
    
    if (localStorage.getItem('darkMode') === 'true') document.body.classList.add('dark');
    // 应用主题
    applyTheme(currentUser.theme || 'ringcity');
};

function updateCurrentUserDisplay() {
    const parts = [escapeHtml(currentUser.id)];
    if (currentUser.title_approved && currentUser.title) parts.push('· '+escapeHtml(currentUser.title));
    document.getElementById('currentUserDisplay').innerText = parts.join(' ');
}

window.logout = () => {
    if (messageInterval) { clearInterval(messageInterval); messageInterval = null; }
    if (userInterval) { clearInterval(userInterval); userInterval = null; }
    currentUser = null;
    document.getElementById('authView').style.display = 'flex';
    document.getElementById('chatView').style.display = 'none';
};

// ===== 标签切换 =====
window.switchTab = (tab) => {
    currentTab = tab;
    document.getElementById('chatPanel').style.display = tab === 'chat' ? 'block' : 'none';
    document.getElementById('guestbookPanel').style.display = tab === 'guestbook' ? 'flex' : 'none';
    document.getElementById('archivePanel').style.display = tab === 'archive' ? 'block' : 'none';
    
    document.querySelectorAll('.top-bar .tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.bottom-nav button[data-tab]').forEach(b => b.classList.remove('active'));
    const topBtn = document.querySelector(`.top-bar .tab-btn[data-tab="${tab}"]`);
    if (topBtn) topBtn.classList.add('active');
    const bottomBtn = document.querySelector(`.bottom-nav button[data-tab="${tab}"]`);
    if (bottomBtn) bottomBtn.classList.add('active');
    
    if (tab === 'chat') {
        loadMessages(true);
    } else if (tab === 'guestbook') {
        loadGuestbook();
    } else if (tab === 'archive') {
        loadArchive();
    }
};

// ===== 消息系统 =====
async function loadMessages(isInitial) {
    const { data } = await ringDB.from('messages').select('*').order('timestamp', { ascending: true }).limit(200);
    const container = document.getElementById('chatMessages');
    if (!container || currentTab !== 'chat') return;
    if (!data || data.length === 0) { 
        if(isInitial) container.innerHTML = '<p style="text-align:center;opacity:0.5;padding:2rem;">暂无消息</p>'; 
        return; 
    }
    const wasAtBottom = container.scrollHeight - container.scrollTop - container.clientHeight < 60;
    
    if (isInitial) { 
        container.innerHTML = ''; 
        renderedMsgIds.clear(); 
        data.forEach(m => appendMessage(m)); 
    } else { 
        data.filter(m => m.timestamp >= lastMsgTimestamp && !renderedMsgIds.has(m.id)).forEach(m => appendMessage(m)); 
    }
    if(data.length > 0) lastMsgTimestamp = data[data.length - 1].timestamp;
    if(wasAtBottom || isInitial) container.scrollTop = container.scrollHeight;
}

function appendMessage(m) {
    renderedMsgIds.add(m.id);
    const container = document.getElementById('chatMessages');
    if (container.querySelector('p[style]')) container.innerHTML = '';
    const isSelf = currentUser && m.from === currentUser.id;
    const div = document.createElement('div');
    div.className = `message ${isSelf ? 'self' : 'other'}`;
    div.innerHTML = `<div class="message-info">${escapeHtml(m.from)} ${new Date(m.timestamp).toLocaleTimeString()}</div><div class="message-bubble">${escapeHtml(m.content)}</div>`;
    container.appendChild(div);
}

window.sendMessage = async () => {
    const inp = document.getElementById('messageInput'); 
    const text = inp.value.trim();
    if (!text) return;
    await ringDB.from('messages').insert({ from: currentUser.id, type: 'text', content: text, timestamp: Date.now() });
    inp.value = ''; 
    loadMessages(true);
};

// ===== 成员列表 =====
async function loadUsers() {
    const { data } = await ringDB.from('users').select('*');
    const kw = (document.getElementById('userSearch')?.value || '').toLowerCase();
    const filtered = (data || []).filter(u => u.id.toLowerCase().includes(kw));
    const now = Date.now();
    const list = document.getElementById('userList'); if (!list) return;
    list.innerHTML = filtered.map(u => {
        const diff = now - (u.last_active || 0);
        const dot = diff < 180000 ? '#4ade80' : diff < 900000 ? '#fbbf24' : '#888';
        // 头像 URL 不转义 (Base64 data URI)
        const avatar = u.avatar && u.avatar_approved ? `<img src="${u.avatar}" class="user-avatar" alt="avatar">` : '';
        const titleTag = u.title_approved && u.title ? `<span class="title-tag">${escapeHtml(u.title)}</span>` : '';
        return `<div class="user-item"><span class="online-dot" style="background:${dot};"></span>${avatar}${escapeHtml(u.id)}${titleTag}</div>`;
    }).join('');
}

// ===== 留言板 =====

    const { data } = await ringDB.from('guestbook').select('*').order('timestamp', { ascending: false }).limit(50);

window.postGuestbook = async () => {

    await ringDB.from('guestbook').insert({ author: currentUser.id, content: text, timestamp: Date.now() });

};

// ===== 公告 =====

// ===== 头像裁剪 =====
window.uploadAvatarPrompt = () => {
    const inp = document.createElement('input'); 
    inp.type = 'file'; 
    inp.accept = 'image/*';
    inp.onchange = () => {
        const file = inp.files[0]; 
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
            const img = new Image(); 
            img.src = e.target.result;
            img.onload = () => showCropModal(img);
        };
        reader.readAsDataURL(file);
    };
    inp.click();
};

function showCropModal(img) {
    const existing = document.querySelector('.crop-overlay');
    if (existing) existing.remove();
    
    const overlay = document.createElement('div'); 
    overlay.className = 'crop-overlay';
    let scale = 1, offsetX = 0, offsetY = 0;
    const size = Math.min(img.width, img.height);
    const initScale = 200 / size;
    scale = initScale;
    offsetX = (280 - img.width * scale) / 2;
    offsetY = (280 - img.height * scale) / 2;
    
    overlay.innerHTML = `
        <div class="crop-container" style="touch-action:none;">
            <img src="${img.src}" id="cropImg" style="width:${img.width}px; height:${img.height}px; transform: translate(${offsetX}px, ${offsetY}px) scale(${scale}); transform-origin: 0 0;">
        </div>
        <div class="crop-frame"></div>
        <div style="margin-top:0.5rem;display:flex;gap:0.5rem; align-items:center;">
            <input type="range" id="cropScaleSlider" min="0.5" max="3" step="0.1" value="${scale}">
            <button id="confirmCropBtn">✅ 确认</button>
            <button id="cancelCropBtn">取消</button>
        </div>`;
    document.body.appendChild(overlay);
    
    const cropImg = overlay.querySelector('#cropImg');
    const slider = overlay.querySelector('#cropScaleSlider');
    const container = overlay.querySelector('.crop-container');
    
    let isDragging = false;
    let lastX, lastY;
    container.addEventListener('mousedown', e => {
        isDragging = true;
        lastX = e.clientX;
        lastY = e.clientY;
        e.preventDefault();
    });
    container.addEventListener('mousemove', e => {
        if (!isDragging) return;
        const dx = e.clientX - lastX;
        const dy = e.clientY - lastY;
        offsetX += dx;
        offsetY += dy;
        lastX = e.clientX;
        lastY = e.clientY;
        updateTransform();
    });
    container.addEventListener('mouseup', () => isDragging = false);
    container.addEventListener('mouseleave', () => isDragging = false);
    
    container.addEventListener('touchstart', e => {
        isDragging = true;
        lastX = e.touches[0].clientX;
        lastY = e.touches[0].clientY;
        e.preventDefault();
    }, {passive: false});
    container.addEventListener('touchmove', e => {
        if (!isDragging) return;
        const dx = e.touches[0].clientX - lastX;
        const dy = e.touches[0].clientY - lastY;
        offsetX += dx;
        offsetY += dy;
        lastX = e.touches[0].clientX;
        lastY = e.touches[0].clientY;
        updateTransform();
    });
    container.addEventListener('touchend', () => isDragging = false);
    
    slider.addEventListener('input', () => {
        scale = parseFloat(slider.value);
        updateTransform();
    });
    
    function updateTransform() {
        cropImg.style.transform = `translate(${offsetX}px, ${offsetY}px) scale(${scale})`;
    }
    
    overlay.querySelector('#confirmCropBtn').addEventListener('click', async () => {
        const cvs = document.createElement('canvas'); 
        cvs.width = 200; 
        cvs.height = 200;
        const ctx = cvs.getContext('2d');
        const cropSize = 200 / scale;
        const sx = (200/scale/2 - offsetX/scale);
        const sy = (200/scale/2 - offsetY/scale);
        ctx.drawImage(img, sx, sy, cropSize, cropSize, 0, 0, 200, 200);
        const base64 = cvs.toDataURL('image/jpeg', 0.8);
        
        await ringDB.from('users').update({ avatar: base64, avatar_approved: false }).eq('id', currentUser.id);
        currentUser.avatar = base64; 
        currentUser.avatar_approved = false;
        alert('✅ 头像已提交审核');
        overlay.remove();
        loadUsers();
    });
    
    overlay.querySelector('#cancelCropBtn').addEventListener('click', () => overlay.remove());
    overlay.addEventListener('click', e => { if(e.target === overlay) overlay.remove(); });
}

// ===== 状态 =====
window.setStatus = async () => {
    const s = prompt('设置个人状态：', currentUser.status || '');
    if (s === null) return;
    await ringDB.from('users').update({ status: s }).eq('id', currentUser.id);
    currentUser.status = s; 
    loadUsers();
};

// ===== 主题系统 =====
function applyTheme(themeId) {
    const theme = THEMES.find(t => t.id === themeId) || THEMES[0];
    const root = document.documentElement;
    const c = theme.colors;
    // 应用主题颜色变量（保留深色模式的自动切换能力，所以不在 root 上硬写 bg/surface 等）
    root.style.setProperty('--accent', c.accent);
    root.style.setProperty('--msg-self', c.msgSelf);
    root.style.setProperty('--msg-other', c.msgOther);
    root.style.setProperty('--sidebar-bg', c.sidebarBg);
    root.style.setProperty('--chat-bg', c.chatBg);
    // 如果有更多变量可以继续添加，但目前这几个足以让主题有明显变化
}

window.openThemePanel = () => {
    const overlay = document.createElement('div'); 
    overlay.className = 'modal-overlay';
    const isAdmin = MODERATORS.includes(currentUser.id);
    const available = isAdmin ? THEMES : THEMES.filter(t => (currentUser.unlocked_themes || []).includes(t.id));
    overlay.innerHTML = `<div class="modal-box"><h3>🎨 界面配置</h3>
        <div class="theme-grid">${available.map(t => {
            const isCurrent = (currentUser.theme || 'ringcity') === t.id;
            return `<div class="theme-card${isCurrent ? ' selected' : ''}" data-theme="${t.id}"><div class="swatch" style="background:${t.swatch};"></div>${t.emoji} ${t.name}</div>`;
        }).join('')}</div>
        ${isAdmin ? `<div style="margin-top:0.5rem;"><b>🎁 赠予主题：</b><input id="giftId" placeholder="对方ID"><select id="giftTheme">${THEMES.map(t => `<option value="${t.id}">${t.name}</option>`).join('')}</select><button id="giftBtn">赠送</button></div>` : ''}
        <button id="closeThemeBtn" style="margin-top:0.5rem;background:var(--surface2);color:var(--text);">关闭</button></div>`;
    document.body.appendChild(overlay);
    
    overlay.querySelectorAll('.theme-card').forEach(card => {
        card.addEventListener('click', () => selectTheme(card.dataset.theme));
    });
    overlay.querySelector('#closeThemeBtn').addEventListener('click', () => overlay.remove());
    if (isAdmin) {
        overlay.querySelector('#giftBtn').addEventListener('click', giftTheme);
    }
    overlay.addEventListener('click', e => { if(e.target === overlay) overlay.remove(); });
};

window.selectTheme = async (themeId) => {
    if (!(currentUser.unlocked_themes || []).includes(themeId) && !MODERATORS.includes(currentUser.id)) return;
    await ringDB.from('users').update({ theme: themeId }).eq('id', currentUser.id);
    currentUser.theme = themeId;
    applyTheme(themeId);
    const overlay = document.querySelector('.modal-overlay');
    if (overlay) overlay.remove();
};

window.giftTheme = async () => {
    const uid = document.getElementById('giftId').value.trim();
    const tid = document.getElementById('giftTheme').value;
    if (!uid) return alert('请输入对方ID');
    const { data } = await ringDB.from('users').select('*').eq('id', uid);
    if (!data || data.length === 0) return alert('用户不存在');
    const themes = typeof data[0].unlocked_themes === 'string' ? JSON.parse(data[0].unlocked_themes) : (data[0].unlocked_themes || ['ringcity']);
    if (themes.includes(tid)) return alert('对方已拥有该主题');
    themes.push(tid);
    await ringDB.from('users').update({ unlocked_themes: JSON.stringify(themes) }).eq('id', uid);
    alert('✅ 已赠送主题');
};

// ===== 管理员面板 =====
window.openAdminPanel = () => {
    if (!MODERATORS.includes(currentUser.id)) return;
    const overlay = document.createElement('div'); 
    overlay.className = 'modal-overlay';
    overlay.innerHTML = `<div class="modal-box"><h3>⚙️ 审核员控制台</h3>
        <div><b>📸 头像审核</b><div id="adminAvatarList"></div></div>
        <div style="margin-top:0.5rem;"><b>🏷️ 头衔审核</b><div id="adminTitleList"></div></div>
        <div style="margin-top:0.5rem;"><b>👤 成员管理</b><div id="adminUserList"></div></div>
        <button id="exportChatBtn">💾 导出聊天记录 (防止赖账)</button>
        <button id="clearChatBtn">🗑️ 清空记录</button>
        <button id="closeAdminBtn" style="background:var(--surface2);color:var(--text);">关闭</button></div>`;
    document.body.appendChild(overlay);
    
    overlay.querySelector('#closeAdminBtn').addEventListener('click', () => overlay.remove());
    overlay.querySelector('#exportChatBtn').addEventListener('click', exportChat);
    overlay.querySelector('#clearChatBtn').addEventListener('click', clearChat);
    overlay.addEventListener('click', e => { if(e.target === overlay) overlay.remove(); });
    
    loadAdminData();
};

async function loadAdminData() {
    const { data: users } = await ringDB.from('users').select('*');
    const { data: msgs } = await ringDB.from('messages').select('from');
    const counts = {}; 
    (msgs || []).forEach(m => { counts[m.from] = (counts[m.from] || 0) + 1; });
    
    const avatarList = document.getElementById('adminAvatarList');
    if (avatarList) {
        avatarList.innerHTML = (users || []).filter(u => u.avatar && !u.avatar_approved).map(u => 
            `<div style="display:flex;align-items:center;gap:0.3rem;margin:0.2rem 0;">
                <img src="${u.avatar}" style="width:25px;height:25px;border-radius:50%;">
                <span style="font-size:0.7rem;">${escapeHtml(u.id)}</span>
                <button onclick="approveAvatar('${escapeHtml(u.id)}')" style="font-size:0.6rem;padding:2px 6px;background:#10b981;">通过</button>
                <button onclick="rejectAvatar('${escapeHtml(u.id)}')" style="font-size:0.6rem;padding:2px 6px;background:#ef4444;">拒绝</button>
            </div>`
        ).join('') || '<p style="opacity:0.5;font-size:0.7rem;">无待审头像</p>';
    }
    
    const titleList = document.getElementById('adminTitleList');
    if (titleList) {
        titleList.innerHTML = (users || []).filter(u => u.title && !u.title_approved).map(u => 
            `<div style="display:flex;align-items:center;gap:0.3rem;margin:0.2rem 0;">
                <span style="font-size:0.7rem;">${escapeHtml(u.id)}</span>
                <span class="title-tag">${escapeHtml(u.title)}</span>
                <button onclick="approveTitle('${escapeHtml(u.id)}')" style="font-size:0.6rem;padding:2px 6px;background:#10b981;">通过</button>
                <button onclick="rejectTitle('${escapeHtml(u.id)}')" style="font-size:0.6rem;padding:2px 6px;background:#ef4444;">拒绝</button>
            </div>`
        ).join('') || '<p style="opacity:0.5;font-size:0.7rem;">无待审头衔</p>';
    }
    
    const userList = document.getElementById('adminUserList');
    if (userList) {
        userList.innerHTML = (users || []).sort((a, b) => (counts[b.id] || 0) - (counts[a.id] || 0)).map(u => 
            `<div style="display:flex;align-items:center;gap:0.3rem;margin:0.2rem 0;font-size:0.7rem;">
                <span>${escapeHtml(u.id)}</span>
                <span style="opacity:0.5;">发言${counts[u.id] || 0}次</span>
                <button onclick="setTitle('${escapeHtml(u.id)}')" style="font-size:0.6rem;padding:2px 6px;">设头衔</button>
            </div>`
        ).join('');
    }
}

window.approveAvatar = async (uid) => { 
    await ringDB.from('users').update({ avatar_approved: true }).eq('id', uid); 
    loadAdminData(); 
    loadUsers(); 
};
window.rejectAvatar = async (uid) => { 
    await ringDB.from('users').update({ avatar: '', avatar_approved: false }).eq('id', uid); 
    loadAdminData(); 
    loadUsers(); 
};
window.approveTitle = async (uid) => { 
    await ringDB.from('users').update({ title_approved: true }).eq('id', uid); 
    loadAdminData(); 
    loadUsers(); 
};
window.rejectTitle = async (uid) => { 
    await ringDB.from('users').update({ title: '', title_approved: false }).eq('id', uid); 
    loadAdminData(); 
    loadUsers(); 
};
window.setTitle = async (uid) => { 
    const t = prompt('输入头衔（需审核）：'); 
    if (t === null) return; 
    await ringDB.from('users').update({ title: t, title_approved: false }).eq('id', uid); 
    loadAdminData(); 
    loadUsers(); 
};

window.exportChat = async () => {
    const { data } = await ringDB.from('messages').select('*').order('timestamp', { ascending: true });
    const text = (data || []).map(m => `[${new Date(m.timestamp).toLocaleString()}] ${m.from}: ${m.content}`).join('\n');
    const blob = new Blob([text], { type: 'text/plain' });
    const a = document.createElement('a'); 
    a.href = URL.createObjectURL(blob); 
    a.download = '环城通讯记录.txt'; 
    a.click();
};

window.clearChat = async () => {
    if (!confirm('确定清空所有聊天记录？')) return;
    // 尝试一次性删除所有行，降级为逐条
    const { error } = await ringDB.from('messages').delete().neq('id', -1);
    if (error) {
        const { data } = await ringDB.from('messages').select('id');
        if (data) for (const m of data) await ringDB.from('messages').delete().eq('id', m.id);
    }
    renderedMsgIds.clear(); 
    lastMsgTimestamp = 0;
    document.getElementById('chatMessages').innerHTML = '<p style="text-align:center;opacity:0.5;padding:2rem;">暂无消息</p>';
};

// ===== 事件绑定 =====
document.getElementById('messageInput').addEventListener('keypress', e => { if (e.key === 'Enter') sendMessage(); });
document.getElementById('userSearch').addEventListener('input', loadUsers);
document.getElementById('worldSearch').addEventListener('input', loadArchive);

document.querySelectorAll('.bottom-nav button[data-tab]').forEach(btn => {
    btn.addEventListener('click', () => switchTab(btn.dataset.tab));
});
document.querySelectorAll('.top-bar .tab-btn').forEach(btn => {
    btn.addEventListener('click', () => switchTab(btn.dataset.tab));
});
</script>
