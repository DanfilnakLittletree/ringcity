<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>环城 · 社团通讯</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm" type="module"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        :root {
            --bg: #f0f2f5; --surface: #fff; --surface2: #f5f5f5; --text: #1e293b;
            --text2: #64748b; --border: #e2e8f0; --accent: #FF7F7F; --msg-self: #FF7F7F;
            --msg-other: #e4e6eb; --sidebar-bg: #f8fafc; --chat-bg: #fff;
        }
        body.dark {
            --bg: #0f1217; --surface: #1a1c28; --surface2: #242636; --text: #eef;
            --text2: #94a3b8; --border: #2c2e40; --accent: #c04040; --msg-self: #c04040;
            --msg-other: #2c2e3e; --sidebar-bg: #141622; --chat-bg: #1a1c28;
        }
        body {
            font-family:'Segoe UI',system-ui,sans-serif;
            background:var(--bg); color:var(--text);
            min-height:100vh; transition:all 0.3s;
        }
        .app-bg { position:fixed; top:0; left:0; width:100%; height:100%; z-index:-1; background:var(--bg); }
        .app-container { max-width:1000px; margin:0 auto; padding:0.5rem; height:100vh; display:flex; flex-direction:column; }
        .auth-card {
            max-width:400px; margin:auto; background:var(--surface);
            border-radius:1.5rem; padding:2rem; text-align:center;
            box-shadow:0 10px 30px rgba(0,0,0,0.1);
        }
        input,select,textarea {
            width:100%; padding:10px; margin:5px 0; border-radius:8px;
            border:1px solid var(--border); background:var(--surface2);
            color:var(--text); font-size:0.95rem; font-family:inherit;
        }
        button {
            padding:10px 16px; border:none; border-radius:8px;
            background:var(--accent); color:white; font-weight:600;
            cursor:pointer; font-size:0.9rem;
        }
        button:hover { opacity:0.85; }
        .chat-layout {
            display:flex; gap:0.5rem; height:100%;
            background:var(--chat-bg); border-radius:1rem;
            padding:0.5rem; overflow:hidden; transition:opacity 0.3s;
        }
        .chat-layout.hidden-chat { opacity:0; pointer-events:none; }
        .sidebar {
            width:200px; background:var(--sidebar-bg); border-radius:0.8rem;
            padding:0.5rem; overflow-y:auto; display:flex; flex-direction:column; flex-shrink:0;
        }
        .sidebar h3 { margin-bottom:0.5rem; font-size:0.85rem; }
        .user-item {
            padding:0.3rem 0.5rem; border-radius:0.5rem;
            display:flex; align-items:center; gap:0.3rem; font-size:0.8rem;
        }
        .user-item:hover { background:rgba(128,128,128,0.1); }
        .online-dot { width:6px; height:6px; border-radius:50%; flex-shrink:0; }
        .user-avatar { width:22px; height:22px; border-radius:50%; object-fit:cover; flex-shrink:0; }
        .title-tag { font-size:0.55rem; background:var(--accent); color:white; padding:1px 5px; border-radius:0.5rem; opacity:0.8; }
        .main-area { flex:1; display:flex; flex-direction:column; min-width:0; overflow:hidden; }
        .top-bar {
            display:flex; gap:0.3rem; margin-bottom:0.4rem;
            align-items:center; flex-shrink:0; flex-wrap:wrap;
        }
        .tab-btn {
            padding:0.3rem 0.7rem; border-radius:0.5rem;
            background:var(--surface2); border:none; color:var(--text2);
            cursor:pointer; font-size:0.75rem;
        }
        .tab-btn.active { background:var(--accent); color:white; }
        .announce-bar {
            background:rgba(245,158,11,0.15); padding:0.3rem 0.6rem;
            border-radius:0.5rem; margin-bottom:0.4rem; font-size:0.75rem;
            overflow:hidden; white-space:nowrap; flex-shrink:0;
        }
        .chat-messages {
            flex:1; overflow-y:auto; padding:0.4rem;
            display:flex; flex-direction:column; gap:0.5rem; min-height:0;
        }
        .message { max-width:80%; flex-shrink:0; }
        .message.self { align-self:flex-end; }
        .message-bubble {
            background:var(--msg-other); padding:0.4rem 0.7rem;
            border-radius:0.7rem; font-size:0.8rem; word-wrap:break-word;
        }
        .message.self .message-bubble { background:var(--msg-self); color:white; }
        .message-info { font-size:0.6rem; opacity:0.6; margin-bottom:0.1rem; }
        .input-area { display:flex; gap:0.4rem; margin-top:0.4rem; flex-shrink:0; }
        .input-area input { flex:1; margin:0; }
        .input-area button { width:auto; }
        .modal-overlay {
            position:fixed; top:0; left:0; width:100%; height:100%;
            background:rgba(0,0,0,0.6); z-index:100;
            display:flex; align-items:center; justify-content:center;
        }
        .modal-box {
            background:var(--surface); border-radius:1rem; padding:1.5rem;
            max-width:500px; width:92%; max-height:85vh; overflow-y:auto;
        }
        .guestbook-item {
            background:var(--surface2); padding:0.4rem 0.6rem;
            border-radius:0.5rem; margin-bottom:0.3rem; font-size:0.8rem;
        }
        .archive-detail {
            background:var(--surface2); padding:0.8rem; border-radius:0.8rem;
            margin-top:0.3rem; font-size:0.85rem; line-height:1.5;
        }
        .footer-note { text-align:center; padding:0.3rem; font-size:0.6rem; opacity:0.3; }
        .hide-chat-btn {
            position:fixed; bottom:5rem; right:1rem; z-index:50;
            width:40px; height:40px; border-radius:50%;
            background:rgba(0,0,0,0.5); color:white; border:none;
            font-size:1.2rem; cursor:pointer;
            display:flex; align-items:center; justify-content:center;
        }
        .bottom-nav {
            display:none; position:fixed; bottom:0; left:0; right:0;
            background:var(--surface); border-top:1px solid var(--border);
            padding:0.4rem; z-index:50; justify-content:space-around;
        }
        .bottom-nav button {
            background:none; color:var(--text2); font-size:0.7rem;
            display:flex; flex-direction:column; align-items:center;
            gap:0.1rem; padding:0.3rem;
        }
        .bottom-nav button.active { color:var(--accent); }
        .crop-overlay {
            position:fixed; top:0; left:0; width:100%; height:100%;
            background:rgba(0,0,0,0.8); z-index:200;
            display:flex; align-items:center; justify-content:center; flex-direction:column;
        }
        .crop-container {
            position:relative; width:280px; height:280px; overflow:hidden; border-radius:1rem;
        }
        .crop-container img { position:absolute; max-width:none; }
        .crop-frame {
            position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
            width:200px; height:200px; border:2px dashed white;
            border-radius:50%; pointer-events:none;
        }
        .theme-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(100px,1fr)); gap:0.5rem; }
        .theme-card {
            padding:0.5rem; border-radius:0.8rem; cursor:pointer; text-align:center;
            border:2px solid transparent; background:var(--surface2);
            font-size:0.75rem; transition:all 0.2s;
        }
        .theme-card:hover { transform:translateY(-2px); }
        .theme-card.selected { border-color:var(--accent); }
        .theme-card .swatch { height:40px; border-radius:0.5rem; margin-bottom:0.3rem; }
        @media (max-width:768px) {
            .sidebar { display:none; }
            .bottom-nav { display:flex; }
            .app-container { padding-bottom:3.5rem; }
            .message { max-width:90%; }
            .hide-chat-btn { bottom:5rem; }
        }

        /* 动画关键帧 */
        @keyframes bgShiftSlow {
            0% { background-position: 0% 0%; }
            100% { background-position: 100% 100%; }
        }
        @keyframes bgShiftSlower {
            0% { background-position: 0% 0%; }
            100% { background-position: 100% 100%; }
        }
        @keyframes cloudDrift {
            0% { background-position: 0% 0; }
            100% { background-position: -200% 0; }
        }
        @keyframes toriiSlide {
            0% { background-position: 0 50%; }
            100% { background-position: -150px 50%; }
        }
        @keyframes norenSway {
            0%, 100% { background-position: 0 0; }
            50% { background-position: 3px 0; }
        }
        @keyframes heartPop {
            0% { transform: scale(0) rotate(0deg); opacity:1; }
            50% { transform: scale(1.4) rotate(10deg); opacity:1; }
            100% { transform: scale(1) rotate(0deg); opacity:0; }
        }
    </style>
</head>

                    <button class="tab-btn" data-tab="archive">📖 档案</button>

                    <button onclick="openThemePanel()" style="background:none;font-size:1rem;">🎨</button>
                    <button onclick="toggleDark()" style="background:none;font-size:1rem;">🌙</button>
                    <button id="adminBtn" onclick="openAdminPanel()" style="display:none;background:none;">⚙️</button>
                </div>
                <div id="announceBar" class="announce-bar" style="display:none;"></div>
                <div id="chatPanel">
                    <div class="chat-messages" id="chatMessages"><p style="text-align:center;opacity:0.5;padding:2rem;">暂无消息</p></div>
                    <div class="input-area">
                        <input type="text" id="messageInput" placeholder="输入消息...">
                        <button onclick="sendMessage()">发送</button>
                    </div>
                </div>
                <div id="guestbookPanel" style="display:none;flex:1;overflow-y:auto;padding:0.3rem;min-height:0;">
                    <div id="guestbookList"></div>
                    <div class="input-area">
                        <input type="text" id="guestbookInput" placeholder="在墙上留一句话...">
                        <button onclick="postGuestbook()">留言</button>
                    </div>
                </div>
                <div id="archivePanel" style="display:none;flex:1;overflow-y:auto;padding:0.3rem;min-height:0;">
                    <input type="text" id="worldSearch" placeholder="🔍 搜索档案..." style="margin-bottom:0.4rem;">
                    <div id="worldCards" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:0.4rem;"></div>
                </div>
            </div>
        </div>
    </div>
    <div class="bottom-nav" id="bottomNav">
        <button class="active" data-tab="chat">💬 通讯</button>
        <button data-tab="guestbook">📝 留言</button>
        <button data-tab="archive">📖 档案</button>
        <button onclick="openProfile()">👤 我</button>
        <button onclick="openThemePanel()">🎨</button>
        <button onclick="toggleDark()">🌙</button>
        <button id="adminBtnMobile" onclick="openAdminPanel()" style="display:none;">⚙️</button>
    </div>
</div>
<div class="footer-note">隙相·不归档·不保留·阅后即忘</div>

// ===== 登录 =====
window.doLogin = async () => {
    const id = document.getElementById('loginId').value.trim();
    const pwd = document.getElementById('loginPwd').value;
    const { data } = await ringDB.from('users').select('*').eq('id', id).eq('pwd', pwd);
    if (!data || data.length === 0) return document.getElementById('loginError').innerText = 'ID或密码错误';
    
    currentUser = data[0];
    if (!currentUser.unlocked_themes) currentUser.unlocked_themes = ['ringcity'];
    if (typeof currentUser.unlocked_themes === 'string') currentUser.unlocked_themes = JSON.parse(currentUser.unlocked_themes);
    
    document.getElementById('authView').style.display = 'none';
    document.getElementById('chatView').style.display = 'flex';
    updateCurrentUserDisplay();
    
    const isAdmin = MODERATORS.includes(currentUser.id);
    document.getElementById('adminBtn').style.display = isAdmin ? 'inline-block' : 'none';
    document.getElementById('adminBtnMobile').style.display = isAdmin ? 'flex' : 'none';
    
    await ringDB.from('users').update({ last_active: Date.now() }).eq('id', id);
    
    if (messageInterval) clearInterval(messageInterval);
    if (userInterval) clearInterval(userInterval);
    
    renderedMsgIds.clear(); 
    lastMsgTimestamp = 0;
    document.getElementById('chatMessages').innerHTML = '<p style="text-align:center;opacity:0.5;padding:2rem;">加载中...</p>';
    
    loadMessages(true); loadUsers(); loadAnnouncement(); loadArchive();
    messageInterval = setInterval(() => loadMessages(false), 3000);
    userInterval = setInterval(loadUsers, 15000);
    
    if (localStorage.getItem('darkMode') === 'true') document.body.classList.add('dark');
    applyTheme(currentUser.theme || 'ringcity');
    initThemeInteractions();
};

};

// ===== 消息 =====
async function loadMessages(isInitial) {
    const { data } = await ringDB.from('messages').select('*').order('timestamp', { ascending: true }).limit(200);
    const container = document.getElementById('chatMessages');
    if (!container || currentTab !== 'chat') return;
    if (!data || data.length === 0) { if(isInitial) container.innerHTML = '<p style="text-align:center;opacity:0.5;padding:2rem;">暂无消息</p>'; return; }
    const wasAtBottom = container.scrollHeight - container.scrollTop - container.clientHeight < 60;
    if (isInitial) { container.innerHTML = ''; renderedMsgIds.clear(); data.forEach(m => appendMessage(m)); }
    else { data.filter(m => m.timestamp >= lastMsgTimestamp && !renderedMsgIds.has(m.id)).forEach(m => appendMessage(m)); }
    if(data.length > 0) lastMsgTimestamp = data[data.length - 1].timestamp;
    if(wasAtBottom || isInitial) container.scrollTop = container.scrollHeight;
}
function appendMessage(m) {
    renderedMsgIds.add(m.id);
    const container = document.getElementById('chatMessages');
    if (container.querySelector('p[style]')) container.innerHTML = '';
    const isSelf = currentUser && m.from === currentUser.id;
    const div = document.createElement('div');
    div.className = `message ${isSelf ? 'self' : 'other'}`;
    div.innerHTML = `<div class="message-info">${escapeHtml(m.from)} ${new Date(m.timestamp).toLocaleTimeString()}</div><div class="message-bubble">${escapeHtml(m.content)}</div>`;
    container.appendChild(div);
}
window.sendMessage = async () => {
    const inp = document.getElementById('messageInput'); const text = inp.value.trim();
    if (!text) return;
    await ringDB.from('messages').insert({ from: currentUser.id, type: 'text', content: text, timestamp: Date.now() });
    inp.value = ''; loadMessages(true);
};

// ===== 成员列表 =====
async function loadUsers() {
    const { data } = await ringDB.from('users').select('*');
    const kw = (document.getElementById('userSearch')?.value || '').toLowerCase();
    const filtered = (data || []).filter(u => u.id.toLowerCase().includes(kw));
    const now = Date.now();
    const list = document.getElementById('userList'); if (!list) return;
    list.innerHTML = filtered.map(u => {
        const diff = now - (u.last_active || 0);
        const dot = diff < 180000 ? '#4ade80' : diff < 900000 ? '#fbbf24' : '#888';
        const avatar = u.avatar && u.avatar_approved ? `<img src="${u.avatar}" class="user-avatar" alt="avatar">` : '';
        const titleTag = u.title_approved && u.title ? `<span class="title-tag">${escapeHtml(u.title)}</span>` : '';
        return `<div class="user-item"><span class="online-dot" style="background:${dot};"></span>${avatar}${escapeHtml(u.id)}${titleTag}</div>`;
    }).join('');
}

// ===== 头像裁剪 =====
window.uploadAvatarPrompt = () => {
    const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*';
    inp.onchange = () => {
        const file = inp.files[0]; if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => { const img = new Image(); img.src = e.target.result; img.onload = () => showCropModal(img); };
        reader.readAsDataURL(file);
    };
    inp.click();
};
function showCropModal(img) {
    const existing = document.querySelector('.crop-overlay'); if (existing) existing.remove();
    const overlay = document.createElement('div'); overlay.className = 'crop-overlay';
    let scale = 1, offsetX = 0, offsetY = 0;
    const initScale = 200 / Math.min(img.width, img.height); scale = initScale;
    offsetX = (280 - img.width * scale) / 2; offsetY = (280 - img.height * scale) / 2;
    overlay.innerHTML = `<div class="crop-container"><img src="${img.src}" id="cropImg" style="width:${img.width}px;height:${img.height}px;transform:translate(${offsetX}px,${offsetY}px) scale(${scale});transform-origin:0 0;"></div><div class="crop-frame"></div>
        <div style="margin-top:0.5rem;display:flex;gap:0.5rem;"><input type="range" id="cropScaleSlider" min="0.5" max="3" step="0.1" value="${scale}"><button id="confirmCropBtn">✅ 确认</button><button id="cancelCropBtn">取消</button></div>`;
    document.body.appendChild(overlay);
    const cropImg = overlay.querySelector('#cropImg');
    const slider = overlay.querySelector('#cropScaleSlider');
    const container = overlay.querySelector('.crop-container');
    let isDragging = false, lastX, lastY;
    container.addEventListener('mousedown', e => { isDragging = true; lastX = e.clientX; lastY = e.clientY; e.preventDefault(); });
    container.addEventListener('mousemove', e => { if (!isDragging) return; offsetX += e.clientX - lastX; offsetY += e.clientY - lastY; lastX = e.clientX; lastY = e.clientY; updateTransform(); });
    container.addEventListener('mouseup', () => isDragging = false);
    container.addEventListener('mouseleave', () => isDragging = false);
    container.addEventListener('touchstart', e => { isDragging = true; lastX = e.touches[0].clientX; lastY = e.touches[0].clientY; e.preventDefault(); }, {passive: false});
    container.addEventListener('touchmove', e => { if (!isDragging) return; offsetX += e.touches[0].clientX - lastX; offsetY += e.touches[0].clientY - lastY; lastX = e.touches[0].clientX; lastY = e.touches[0].clientY; updateTransform(); });
    container.addEventListener('touchend', () => isDragging = false);
    slider.addEventListener('input', () => { scale = parseFloat(slider.value); updateTransform(); });
    function updateTransform() { cropImg.style.transform = `translate(${offsetX}px, ${offsetY}px) scale(${scale})`; }
    overlay.querySelector('#confirmCropBtn').addEventListener('click', async () => {
        const cvs = document.createElement('canvas'); cvs.width = 200; cvs.height = 200;
        const ctx = cvs.getContext('2d');
        const cropSize = 200 / scale;
        ctx.drawImage(img, (200/scale/2 - offsetX/scale), (200/scale/2 - offsetY/scale), cropSize, cropSize, 0, 0, 200, 200);
        const base64 = cvs.toDataURL('image/jpeg', 0.8);
        await ringDB.from('users').update({ avatar: base64, avatar_approved: false }).eq('id', currentUser.id);
        currentUser.avatar = base64; currentUser.avatar_approved = false;
        alert('✅ 头像已提交审核'); overlay.remove(); loadUsers();
    });
    overlay.querySelector('#cancelCropBtn').addEventListener('click', () => overlay.remove());
    overlay.addEventListener('click', e => { if(e.target === overlay) overlay.remove(); });
}

window.setStatus = async () => {
    const s = prompt('设置个人状态：', currentUser.status || '');
    if (s === null) return;
    await ringDB.from('users').update({ status: s }).eq('id', currentUser.id);
    currentUser.status = s; loadUsers();
};

// ===== 主题系统 =====
function applyTheme(themeId) {
    const theme = THEMES.find(t => t.id === themeId) || THEMES[0];
    const root = document.documentElement;
    const c = theme.colors;
    root.style.setProperty('--accent', c.accent);
    root.style.setProperty('--msg-self', c.msgSelf);
    root.style.setProperty('--msg-other', c.msgOther);
    root.style.setProperty('--sidebar-bg', c.sidebarBg);
    root.style.setProperty('--chat-bg', c.chatBg);

    const appBg = document.querySelector('.app-bg');
    let bgLayers = [theme.bg];
    if (theme.pattern && theme.pattern !== 'none') bgLayers.push(theme.pattern);
    if (theme.extraBg) bgLayers.push(theme.extraBg);
    appBg.style.background = bgLayers.join(', ');
    appBg.style.backgroundSize = [theme.bgSize || 'auto', theme.patternSize || 'auto', theme.extraBgSize || 'auto'].join(', ');
    appBg.style.backgroundPosition = [theme.bgPosition || '0 0', theme.patternPosition || '0 0', '0 0'].join(', ');
    appBg.style.backgroundRepeat = ['no-repeat', theme.patternRepeat || 'repeat', 'repeat'].join(', ');

    // 动画
    appBg.style.animation = 'none';
    if (theme.bgAnimation && theme.bgAnimation !== 'none') {
        appBg.style.animation = theme.bgAnimation;
        if (theme.bgAnimationPattern && theme.bgAnimationPattern !== 'none') {
            appBg.style.animation += `, ${theme.bgAnimationPattern}`;
        }
    } else if (theme.bgAnimationPattern && theme.bgAnimationPattern !== 'none') {
        appBg.style.animation = theme.bgAnimationPattern;
    }

    // 重新绑定主题点击事件（瑞茨尔、草莓）
    if (themeClickHandler) {
        document.body.removeEventListener('click', themeClickHandler);
        themeClickHandler = null;
    }
    if (themeId === 'ritzlicht' || themeId === 'strawberry-sweet') {
        themeClickHandler = (e) => {
            if (themeId === 'ritzlicht') {
                for (let i = 0; i < 3; i++) {
                    const paw = document.createElement('div');
                    paw.innerText = 'ฅ';
                    paw.style.cssText = `position:fixed; left:${e.clientX-10}px; top:${e.clientY-10}px; font-size:20px; color:${Math.random()>0.5?'#0047ab':'#e6b860'}; pointer-events:none; z-index:999; opacity:1; transition:all 0.8s ease-out; transform:translate(0,0) scale(1);`;
                    document.body.appendChild(paw);
                    const angle = Math.random() * Math.PI * 2;
                    const dist = 30 + Math.random() * 30;
                    requestAnimationFrame(() => {
                        paw.style.transform = `translate(${Math.cos(angle)*dist}px, ${Math.sin(angle)*dist}px) scale(0.2)`;
                        paw.style.opacity = '0';
                    });
                    setTimeout(() => paw.remove(), 800);
                }
            } else if (themeId === 'strawberry-sweet') {
                const heart = document.createElement('div');
                heart.innerText = '❤️';
                heart.style.cssText = `position:fixed; left:${e.clientX-10}px; top:${e.clientY-10}px; font-size:24px; pointer-events:none; z-index:999; animation:heartPop 0.6s ease-out forwards;`;
                document.body.appendChild(heart);
                setTimeout(() => heart.remove(), 600);
            }
        };
        document.body.addEventListener('click', themeClickHandler);
    }
}

window.openThemePanel = () => {
    const overlay = document.createElement('div'); overlay.className = 'modal-overlay';
    const isAdmin = MODERATORS.includes(currentUser.id);
    const available = isAdmin ? THEMES : THEMES.filter(t => (currentUser.unlocked_themes || []).includes(t.id));
    overlay.innerHTML = `<div class="modal-box"><h3>🎨 界面配置</h3>
        <div class="theme-grid">${available.map(t => `<div class="theme-card${(currentUser.theme||'ringcity')===t.id?' selected':''}" data-theme="${t.id}"><div class="swatch" style="background:${t.swatch};"></div>${t.emoji} ${t.name}</div>`).join('')}</div>
        ${isAdmin ? `<div style="margin-top:0.5rem;"><b>🎁 赠予主题：</b><input id="giftId" placeholder="对方ID"><select id="giftTheme">${THEMES.map(t => `<option value="${t.id}">${t.name}</option>`).join('')}</select><button id="giftBtn">赠送</button></div>` : ''}
        <button id="closeThemeBtn" style="margin-top:0.5rem;background:var(--surface2);color:var(--text);">关闭</button></div>`;
    document.body.appendChild(overlay);
    overlay.querySelectorAll('.theme-card').forEach(card => card.addEventListener('click', () => selectTheme(card.dataset.theme)));
    overlay.querySelector('#closeThemeBtn').addEventListener('click', () => overlay.remove());
    if (isAdmin) overlay.querySelector('#giftBtn').addEventListener('click', giftTheme);
    overlay.addEventListener('click', e => { if(e.target === overlay) overlay.remove(); });
};

window.selectTheme = async (themeId) => {
    if (!(currentUser.unlocked_themes || []).includes(themeId) && !MODERATORS.includes(currentUser.id)) return;
    await ringDB.from('users').update({ theme: themeId }).eq('id', currentUser.id);
    currentUser.theme = themeId;
    applyTheme(themeId);
    document.querySelector('.modal-overlay')?.remove();
};

window.giftTheme = async () => {
    const uid = document.getElementById('giftId').value.trim();
    const tid = document.getElementById('giftTheme').value;
    if (!uid) return alert('请输入对方ID');
    const { data } = await ringDB.from('users').select('*').eq('id', uid);
    if (!data || data.length === 0) return alert('用户不存在');
    const themes = typeof data[0].unlocked_themes === 'string' ? JSON.parse(data[0].unlocked_themes) : (data[0].unlocked_themes || ['ringcity']);
    if (themes.includes(tid)) return alert('对方已拥有该主题');
    themes.push(tid);
    await ringDB.from('users').update({ unlocked_themes: JSON.stringify(themes) }).eq('id', uid);
    alert('✅ 已赠送主题');
};

// ===== 管理员面板 =====
window.openAdminPanel = () => {
    if (!MODERATORS.includes(currentUser.id)) return;
    const overlay = document.createElement('div'); overlay.className = 'modal-overlay';
    overlay.innerHTML = `<div class="modal-box"><h3>⚙️ 审核员控制台</h3>
        <div><b>📸 头像审核</b><div id="adminAvatarList"></div></div>
        <div style="margin-top:0.5rem;"><b>🏷️ 头衔审核</b><div id="adminTitleList"></div></div>
        <div style="margin-top:0.5rem;"><b>👤 成员管理</b><div id="adminUserList"></div></div>
        <button id="exportChatBtn">💾 导出聊天记录 (防止赖账)</button>
        <button id="clearChatBtn">🗑️ 清空记录</button>
        <button id="closeAdminBtn" style="background:var(--surface2);color:var(--text);">关闭</button></div>`;
    document.body.appendChild(overlay);
    overlay.querySelector('#closeAdminBtn').addEventListener('click', () => overlay.remove());
    overlay.querySelector('#exportChatBtn').addEventListener('click', exportChat);
    overlay.querySelector('#clearChatBtn').addEventListener('click', clearChat);
    overlay.addEventListener('click', e => { if(e.target === overlay) overlay.remove(); });
    loadAdminData();
};

async function loadAdminData() {
    const { data: users } = await ringDB.from('users').select('*');
    const { data: msgs } = await ringDB.from('messages').select('from');
    const counts = {}; (msgs || []).forEach(m => { counts[m.from] = (counts[m.from] || 0) + 1; });
    const avatarList = document.getElementById('adminAvatarList');
    if (avatarList) {
        avatarList.innerHTML = (users || []).filter(u => u.avatar && !u.avatar_approved).map(u => `<div style="display:flex;align-items:center;gap:0.3rem;margin:0.2rem 0;"><img src="${u.avatar}" style="width:25px;height:25px;border-radius:50%;"><span style="font-size:0.7rem;">${escapeHtml(u.id)}</span><button onclick="approveAvatar('${escapeHtml(u.id)}')" style="font-size:0.6rem;padding:2px 6px;background:#10b981;">通过</button><button onclick="rejectAvatar('${escapeHtml(u.id)}')" style="font-size:0.6rem;padding:2px 6px;background:#ef4444;">拒绝</button></div>`).join('') || '<p style="opacity:0.5;">无待审头像</p>';
    }
    const titleList = document.getElementById('adminTitleList');
    if (titleList) {
        titleList.innerHTML = (users || []).filter(u => u.title && !u.title_approved).map(u => `<div style="display:flex;align-items:center;gap:0.3rem;margin:0.2rem 0;"><span style="font-size:0.7rem;">${escapeHtml(u.id)}</span><span class="title-tag">${escapeHtml(u.title)}</span><button onclick="approveTitle('${escapeHtml(u.id)}')" style="font-size:0.6rem;padding:2px 6px;background:#10b981;">通过</button><button onclick="rejectTitle('${escapeHtml(u.id)}')" style="font-size:0.6rem;padding:2px 6px;background:#ef4444;">拒绝</button></div>`).join('') || '<p style="opacity:0.5;">无待审头衔</p>';
    }
    const userList = document.getElementById('adminUserList');
    if (userList) {
        userList.innerHTML = (users || []).sort((a,b)=>(counts[b.id]||0)-(counts[a.id]||0)).map(u => `<div style="display:flex;align-items:center;gap:0.3rem;margin:0.2rem 0;font-size:0.7rem;"><span>${escapeHtml(u.id)}</span><span style="opacity:0.5;">发言${counts[u.id]||0}次</span><button onclick="setTitle('${escapeHtml(u.id)}')" style="font-size:0.6rem;padding:2px 6px;">设头衔</button></div>`).join('');
    }
}
window.approveAvatar = async (uid) => { await ringDB.from('users').update({avatar_approved:true}).eq('id',uid); loadAdminData(); loadUsers(); };
window.rejectAvatar = async (uid) => { await ringDB.from('users').update({avatar:'',avatar_approved:false}).eq('id',uid); loadAdminData(); loadUsers(); };
window.approveTitle = async (uid) => { await ringDB.from('users').update({title_approved:true}).eq('id',uid); loadAdminData(); loadUsers(); };
window.rejectTitle = async (uid) => { await ringDB.from('users').update({title:'',title_approved:false}).eq('id',uid); loadAdminData(); loadUsers(); };
window.setTitle = async (uid) => { const t=prompt('输入头衔（需审核）：'); if(t===null) return; await ringDB.from('users').update({title:t,title_approved:false}).eq('id',uid); loadAdminData(); loadUsers(); };
window.exportChat = async () => {
    const { data } = await ringDB.from('messages').select('*').order('timestamp',{ascending:true});
    const text = (data||[]).map(m=>`[${new Date(m.timestamp).toLocaleString()}] ${m.from}: ${m.content}`).join('\n');
    const blob = new Blob([text],{type:'text/plain'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='环城通讯记录.txt'; a.click();
};
window.clearChat = async () => {
    if(!confirm('确定清空所有聊天记录？')) return;
    const { error } = await ringDB.from('messages').delete().neq('id', -1);
    if (error) { const { data } = await ringDB.from('messages').select('id'); if(data) for(const m of data) await ringDB.from('messages').delete().eq('id',m.id); }
    renderedMsgIds.clear(); lastMsgTimestamp=0;
    document.getElementById('chatMessages').innerHTML='<p style="text-align:center;opacity:0.5;padding:2rem;">暂无消息</p>';
};

// ===== 事件绑定 =====
document.getElementById('messageInput').addEventListener('keypress',e=>{if(e.key==='Enter') sendMessage();});
document.getElementById('userSearch').addEventListener('input',loadUsers);
document.getElementById('worldSearch').addEventListener('input',loadArchive);
document.querySelectorAll('.bottom-nav button[data-tab]').forEach(btn => btn.addEventListener('click', () => switchTab(btn.dataset.tab)));
document.querySelectorAll('.top-bar .tab-btn').forEach(btn => btn.addEventListener('click', () => switchTab(btn.dataset.tab)));

function initThemeInteractions() {
    // 登录时首次应用主题后调用
    applyTheme(currentUser.theme || 'ringcity');
}
</script>
