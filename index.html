<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>环城 · 社团聊天室</title>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background: white; padding: 2rem; border-radius: 1rem; width: 320px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        input { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #ddd; }
        button { width: 100%; padding: 12px; margin: 5px 0; border: none; border-radius: 8px; background: #FF7F7F; color: white; font-weight: bold; cursor: pointer; }
        .msg { margin-top: 1rem; font-size: 0.9rem; }
        .error { color: #ef4444; }
        .success { color: #10b981; }
    </style>
</head>
<body>
<div class="box">
    <h2>🏛️ 环城连接测试</h2>
    <input type="text" id="userId" placeholder="输入ID">
    <input type="password" id="userPwd" placeholder="输入密码">
    <button onclick="doRegister()">注册</button>
    <button onclick="doLogin()">登录</button>
    <div id="msg" class="msg"></div>
</div>

<script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    const SUPABASE_URL = 'https://fflngacqldvyzvhpolch.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZmbG5nYWNxbGR2eXp2aHBvbGNoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE4ODQ3MTAsImV4cCI6MjA5NzQ2MDcxMH0.bkLyI6T4zNzClNlHqNO4O7wPu40Ep6xb2x5cUD0Hvgk';
    
    const ringDB = createClient(SUPABASE_URL, SUPABASE_KEY, {
        auth: { persistSession: false }
    });

    window.doRegister = async function() {
        const id = document.getElementById('userId').value.trim();
        const pwd = document.getElementById('userPwd').value;
        if (!id || !pwd) return show('请填写ID和密码', true);
        const { error } = await ringDB.from('users').insert({ id, pwd, theme:'ringcity', unlocked_themes:'["ringcity"]', view_mode:'desktop' });
        if (error) {
            if (error.message.includes('duplicate')) return show('ID已存在', true);
            return show('注册失败: ' + error.message, true);
        }
        show('✅ 注册成功！现在可以登录了', false);
    };

    window.doLogin = async function() {
        const id = document.getElementById('userId').value.trim();
        const pwd = document.getElementById('userPwd').value;
        if (!id || !pwd) return show('请填写ID和密码', true);
        const { data, error } = await ringDB.from('users').select('*').eq('id', id).eq('pwd', pwd);
        if (error) return show('登录失败: ' + error.message, true);
        if (!data || data.length === 0) return show('ID或密码错误', true);
        show('🎉 登录成功！欢迎回来，' + data[0].id, false);
    };

    function show(msgText, isError) {
        const m = document.getElementById('msg');
        m.innerText = msgText;
        m.className = 'msg ' + (isError ? 'error' : 'success');
    }
</script>
</body>
</html>
